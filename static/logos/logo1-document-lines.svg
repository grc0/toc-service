<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Concept 1: Document with TOC lines -->
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A2980"/>
      <stop offset="100%" style="stop-color:#26D0CE"/>
    </linearGradient>
  </defs>
  <!-- Document shape -->
  <rect x="40" y="20" width="120" height="160" rx="8" fill="white" stroke="url(#g1)" stroke-width="4"/>
  <!-- Folded corner -->
  <path d="M 130 20 L 160 50 L 130 50 Z" fill="#EFF6FF" stroke="url(#g1)" stroke-width="2"/>
  <!-- TOC lines with dots -->
  <rect x="60" y="65" width="40" height="6" rx="3" fill="#1A2980"/>
  <circle cx="115" cy="68" r="2" fill="#1A2980" opacity="0.4"/>
  <circle cx="121" cy="68" r="2" fill="#1A2980" opacity="0.4"/>
  <circle cx="127" cy="68" r="2" fill="#1A2980" opacity="0.4"/>
  <text x="138" y="72" font-family="sans-serif" font-size="11" fill="#1A2980" font-weight="bold">1</text>

  <rect x="60" y="85" width="55" height="6" rx="3" fill="#2563EB"/>
  <circle cx="127" cy="88" r="2" fill="#2563EB" opacity="0.4"/>
  <circle cx="133" cy="88" r="2" fill="#2563EB" opacity="0.4"/>
  <text x="138" y="92" font-family="sans-serif" font-size="11" fill="#2563EB" font-weight="bold">5</text>

  <rect x="60" y="105" width="35" height="6" rx="3" fill="#26D0CE"/>
  <circle cx="109" cy="108" r="2" fill="#26D0CE" opacity="0.4"/>
  <circle cx="115" cy="108" r="2" fill="#26D0CE" opacity="0.4"/>
  <circle cx="121" cy="108" r="2" fill="#26D0CE" opacity="0.4"/>
  <circle cx="127" cy="108" r="2" fill="#26D0CE" opacity="0.4"/>
  <circle cx="133" cy="108" r="2" fill="#26D0CE" opacity="0.4"/>
  <text x="138" y="112" font-family="sans-serif" font-size="11" fill="#26D0CE" font-weight="bold">9</text>

  <rect x="60" y="125" width="48" height="6" rx="3" fill="#059669"/>
  <circle cx="121" cy="128" r="2" fill="#059669" opacity="0.4"/>
  <circle cx="127" cy="128" r="2" fill="#059669" opacity="0.4"/>
  <circle cx="133" cy="128" r="2" fill="#059669" opacity="0.4"/>
  <text x="136" y="132" font-family="sans-serif" font-size="11" fill="#059669" font-weight="bold">14</text>

  <!-- Label -->
  <text x="100" y="158" font-family="sans-serif" font-size="10" fill="#1A2980" text-anchor="middle" font-weight="bold">TOC</text>
</svg>