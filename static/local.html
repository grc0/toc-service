<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF TOC Generator – Local</title>
  <link rel="icon" type="image/svg+xml" href="/static/logos/logo3a.svg">
  <script src="/static/tailwindcss.js"></script>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/theme.css">
  <style>
    /* Palette and shared drag/drop rules live in theme.css */
    html { overflow-y: scroll; }
    .sort-btn { transition: all 0.15s; }
    .color-preview { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }

    /* Form controls follow the active theme */
    input[type="text"], select, input[type="file"] {
      background: var(--c-surface-raised);
      color: var(--c-text);
    }
    select option { background: var(--c-surface-raised); color: var(--c-text); }
    input[type="text"]::placeholder { color: var(--c-text-faint); }
  </style>
</head>
<body class="bg-surface text-content min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-8">

    <!-- Header -->
    <div class="mb-8 flex justify-between items-start">
      <div class="flex items-center gap-3">
        <img src="/static/logos/logo3a.svg" alt="" class="h-10 w-10">
        <div>
          <h1 class="text-2xl font-bold text-content" data-i18n="title"></h1>
          <p class="text-muted mt-1" data-i18n="localModeSubtitle"></p>
        </div>
      </div>
      <div class="flex items-center gap-3 mt-1">
        <button onclick="toggleTheme()" id="theme-toggle"
          class="p-1.5 rounded-md text-faint hover:text-content hover:bg-raised transition-colors" title="Toggle theme">
          <svg id="theme-icon-sun" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
          </svg>
          <svg id="theme-icon-moon" class="h-4 w-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
          </svg>
        </button>
        <div class="flex items-center gap-1">
          <button onclick="setLang('en')" id="lang-en" class="px-2 py-1 text-xs font-medium rounded transition-colors">EN</button>
          <span class="text-faint">|</span>
          <button onclick="setLang('de')" id="lang-de" class="px-2 py-1 text-xs font-medium rounded transition-colors">DE</button>
        </div>
      </div>
    </div>

    <!-- Status / Result Area -->
    <div id="result-area" class="hidden mb-6">
      <div id="status-processing" class="hidden flex items-center gap-3 p-4 bg-tint rounded-lg">
        <svg class="animate-spin h-5 w-5 text-accent-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
        </svg>
        <span class="text-sm text-accent-700" id="processing-text" data-i18n="statusProcessing"></span>
      </div>
      <div id="status-success" class="hidden p-4 bg-tint rounded-lg">
        <div class="flex items-center gap-3">
          <svg class="h-5 w-5 text-accent-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          <span id="success-text" class="text-sm text-accent-700"></span>
        </div>
        <a id="download-link" href="#" download
          class="mt-3 inline-flex items-center gap-2 px-4 py-2 bg-accent-600 text-white text-sm font-medium rounded-md hover:bg-accent-700 transition-colors">
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span id="download-filename"></span>
        </a>
      </div>
      <div id="status-error" class="hidden p-4 bg-danger-tint rounded-lg">
        <div class="flex items-center gap-3">
          <svg class="h-5 w-5 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
          <span id="error-text" class="text-sm text-danger"></span>
        </div>
      </div>
    </div>

    <div class="lg:grid lg:grid-cols-[minmax(0,1fr)_400px] lg:gap-8 lg:items-start">
    <div><!-- Form column -->

    <!-- Tabs -->
    <div class="flex border-b border-line mb-6">
      <button id="tab-a" onclick="switchTab('a')"
        class="px-4 py-2 text-sm font-medium border-b-2 border-accent-600 text-accent-600"
        data-i18n="tabA"></button>
      <button id="tab-b" onclick="switchTab('b')"
        class="px-4 py-2 text-sm font-medium border-b-2 border-transparent text-muted hover:text-content"
        data-i18n="tabB"></button>
    </div>

    <!-- Modus A Panel -->
    <div id="panel-a">
      <div class="space-y-4">
        <div class="grid grid-cols-[1fr_1fr_auto] gap-3">
          <div>
            <label for="title-a" class="block text-sm font-medium text-content mb-1">
              <span data-i18n="labelTitle"></span> <span class="text-faint" data-i18n="labelOptional"></span>
            </label>
            <input type="text" id="title-a" data-i18n-placeholder="placeholderTitleA"
              class="w-full px-3 py-2 border border-line rounded-md text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500">
          </div>
          <div>
            <label for="subtitle-a" class="block text-sm font-medium text-content mb-1">
              <span data-i18n="labelSubtitle"></span> <span class="text-faint" data-i18n="labelOptional"></span>
            </label>
            <input type="text" id="subtitle-a" data-i18n-placeholder="placeholderSubtitle"
              class="w-full px-3 py-2 border border-line rounded-md text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500">
          </div>
          <div>
            <label for="font-a" class="block text-sm font-medium text-content mb-1" data-i18n="labelFont"></label>
            <select id="font-a"
              class="w-full px-3 py-2 border border-line rounded-md text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500 bg-raised">
              <option value="IBM Plex Sans">IBM Plex Sans</option>
              <option value="Inter">Inter</option>
              <option value="Roboto">Roboto</option>
            </select>
          </div>
        </div>

        <div class="flex flex-col gap-1 -mt-2">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="merge-only-a"
              class="h-4 w-4 rounded border-line text-accent-600 focus:ring-accent-500"
              onchange="toggleMergeOnly()">
            <span class="text-sm text-muted" data-i18n="labelMergeOnly"></span>
          </label>
        </div>

        <div id="toc-options-a" class="flex flex-col gap-1 -mt-2">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="dots-a" checked class="h-4 w-4 rounded border-line text-accent-600 focus:ring-accent-500">
            <span class="text-sm text-muted" data-i18n="labelDotLeaders"></span>
          </label>
          <div class="flex items-center gap-2">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" id="lines-a" checked class="h-4 w-4 rounded border-line text-accent-600 focus:ring-accent-500" onchange="toggleColorPicker('a')">
              <span class="text-sm text-muted" data-i18n="labelShowLines"></span>
            </label>
            <span id="color-picker-a" class="inline-flex items-center gap-1.5">
              <span id="color-dot-a" class="color-preview" style="background:#1A2980"></span>
              <select id="color-select-a" onchange="onColorSelectChange('a')" class="px-1.5 py-0.5 border border-line rounded text-xs focus:ring-2 focus:ring-accent-500 focus:border-accent-500 bg-raised"></select>
              <input type="text" id="color-custom-a" maxlength="7" placeholder="#FF5500" class="hidden w-20 px-2 py-0.5 border border-line rounded text-xs font-mono focus:ring-2 focus:ring-accent-500 focus:border-accent-500" oninput="onCustomColorInput('a')">
            </span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-sm text-muted" data-i18n="labelBgColor"></span>
            <span class="inline-flex items-center gap-1.5">
              <span id="bg-dot-a" class="color-preview" style="background:#FFFFFF; border: 1px solid #d4d4d8"></span>
              <select id="bg-select-a" onchange="onBgColorSelectChange('a')" class="px-1.5 py-0.5 border border-line rounded text-xs focus:ring-2 focus:ring-accent-500 focus:border-accent-500 bg-raised"></select>
              <input type="text" id="bg-custom-a" maxlength="7" placeholder="#F3F4F6" class="hidden w-20 px-2 py-0.5 border border-line rounded text-xs font-mono focus:ring-2 focus:ring-accent-500 focus:border-accent-500" oninput="onBgCustomColorInput('a')">
            </span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-sm text-muted" data-i18n="labelFontColor"></span>
            <span class="inline-flex items-center gap-1.5">
              <span id="fc-dot-a" class="color-preview" style="background:#000000"></span>
              <select id="fc-select-a" onchange="onFontColorSelectChange('a')" class="px-1.5 py-0.5 border border-line rounded text-xs focus:ring-2 focus:ring-accent-500 focus:border-accent-500 bg-raised"></select>
              <input type="text" id="fc-custom-a" maxlength="7" placeholder="#333333" class="hidden w-20 px-2 py-0.5 border border-line rounded text-xs font-mono focus:ring-2 focus:ring-accent-500 focus:border-accent-500" oninput="onFontColorCustomInput('a')">
            </span>
          </div>
        </div>

        <button id="btn-generate-a" onclick="generateA()" disabled
          class="w-full py-2.5 px-4 bg-accent-600 text-white text-sm font-medium rounded-md hover:bg-accent-700 disabled:bg-line disabled:cursor-not-allowed transition-colors"
          data-i18n="btnGenerate"></button>

        <div>
          <label class="block text-sm font-medium text-content mb-1" data-i18n="labelPdfFiles"></label>
          <div id="dropzone-a"
            class="drop-zone border-2 border-dashed border-line rounded-lg p-8 text-center cursor-pointer hover:border-line-strong transition-colors"
            onclick="document.getElementById('fileinput-a').click()">
            <svg class="mx-auto h-10 w-10 text-faint mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <p class="text-sm text-muted" data-i18n-html="dropzoneText"></p>
            <p class="text-xs text-faint mt-1" data-i18n="dropzoneHint"></p>
          </div>
          <input type="file" id="fileinput-a" multiple accept=".pdf" class="hidden" onchange="handleFilesA(this.files)">
        </div>

        <div id="filelist-a" class="hidden">
          <div class="flex justify-between items-center mb-1">
            <span class="text-sm font-medium text-content" data-i18n="selectedFiles"></span>
            <div class="flex items-center gap-2">
              <span class="text-xs text-faint" data-i18n="sortLabel"></span>
              <button onclick="sortFilesA('az')" class="sort-btn px-2 py-0.5 text-xs rounded border border-line text-muted hover:bg-raised hover:border-line-strong" data-i18n="sortAZ"></button>
              <button onclick="sortFilesA('za')" class="sort-btn px-2 py-0.5 text-xs rounded border border-line text-muted hover:bg-raised hover:border-line-strong" data-i18n="sortZA"></button>
              <span class="text-faint">|</span>
              <button onclick="clearFilesA()" class="text-xs text-danger hover:text-danger" data-i18n="removeAll"></button>
            </div>
          </div>
          <ul id="files-a" class="space-y-1"></ul>
          <p class="text-xs text-faint mt-1.5" id="drag-hint"></p>
        </div>
      </div>
    </div>

    <!-- Modus B Panel -->
    <div id="panel-b" class="hidden">
      <div class="space-y-4">
        <div class="grid grid-cols-[1fr_1fr_auto] gap-3">
          <div>
            <label for="title-b" class="block text-sm font-medium text-content mb-1">
              <span data-i18n="labelTitle"></span> <span class="text-faint" data-i18n="labelOptional"></span>
            </label>
            <input type="text" id="title-b" data-i18n-placeholder="placeholderTitleB"
              class="w-full px-3 py-2 border border-line rounded-md text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500">
          </div>
          <div>
            <label for="subtitle-b" class="block text-sm font-medium text-content mb-1">
              <span data-i18n="labelSubtitle"></span> <span class="text-faint" data-i18n="labelOptional"></span>
            </label>
            <input type="text" id="subtitle-b" data-i18n-placeholder="placeholderSubtitle"
              class="w-full px-3 py-2 border border-line rounded-md text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500">
          </div>
          <div>
            <label for="font-b" class="block text-sm font-medium text-content mb-1" data-i18n="labelFont"></label>
            <select id="font-b"
              class="w-full px-3 py-2 border border-line rounded-md text-sm focus:ring-2 focus:ring-accent-500 focus:border-accent-500 bg-raised">
              <option value="IBM Plex Sans">IBM Plex Sans</option>
              <option value="Inter">Inter</option>
              <option value="Roboto">Roboto</option>
            </select>
          </div>
        </div>

        <div class="flex flex-col gap-1 -mt-2">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="dots-b" checked class="h-4 w-4 rounded border-line text-accent-600 focus:ring-accent-500">
            <span class="text-sm text-muted" data-i18n="labelDotLeaders"></span>
          </label>
          <div class="flex items-center gap-2">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" id="lines-b" checked class="h-4 w-4 rounded border-line text-accent-600 focus:ring-accent-500" onchange="toggleColorPicker('b')">
              <span class="text-sm text-muted" data-i18n="labelShowLines"></span>
            </label>
            <span id="color-picker-b" class="inline-flex items-center gap-1.5">
              <span id="color-dot-b" class="color-preview" style="background:#1A2980"></span>
              <select id="color-select-b" onchange="onColorSelectChange('b')" class="px-1.5 py-0.5 border border-line rounded text-xs focus:ring-2 focus:ring-accent-500 focus:border-accent-500 bg-raised"></select>
              <input type="text" id="color-custom-b" maxlength="7" placeholder="#FF5500" class="hidden w-20 px-2 py-0.5 border border-line rounded text-xs font-mono focus:ring-2 focus:ring-accent-500 focus:border-accent-500" oninput="onCustomColorInput('b')">
            </span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-sm text-muted" data-i18n="labelBgColor"></span>
            <span class="inline-flex items-center gap-1.5">
              <span id="bg-dot-b" class="color-preview" style="background:#FFFFFF; border: 1px solid #d4d4d8"></span>
              <select id="bg-select-b" onchange="onBgColorSelectChange('b')" class="px-1.5 py-0.5 border border-line rounded text-xs focus:ring-2 focus:ring-accent-500 focus:border-accent-500 bg-raised"></select>
              <input type="text" id="bg-custom-b" maxlength="7" placeholder="#F3F4F6" class="hidden w-20 px-2 py-0.5 border border-line rounded text-xs font-mono focus:ring-2 focus:ring-accent-500 focus:border-accent-500" oninput="onBgCustomColorInput('b')">
            </span>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-sm text-muted" data-i18n="labelFontColor"></span>
            <span class="inline-flex items-center gap-1.5">
              <span id="fc-dot-b" class="color-preview" style="background:#000000"></span>
              <select id="fc-select-b" onchange="onFontColorSelectChange('b')" class="px-1.5 py-0.5 border border-line rounded text-xs focus:ring-2 focus:ring-accent-500 focus:border-accent-500 bg-raised"></select>
              <input type="text" id="fc-custom-b" maxlength="7" placeholder="#333333" class="hidden w-20 px-2 py-0.5 border border-line rounded text-xs font-mono focus:ring-2 focus:ring-accent-500 focus:border-accent-500" oninput="onFontColorCustomInput('b')">
            </span>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-content mb-1" data-i18n="labelPdfFile"></label>
          <div class="flex items-center gap-2">
            <input type="file" id="fileinput-pdf" accept=".pdf"
              class="block w-full text-sm text-muted file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-accent-50 file:text-accent-700 hover:file:bg-accent-100">
          </div>
          <p class="text-xs text-faint mt-1" data-i18n="pdfHint"></p>
        </div>

        <div>
          <label class="block text-sm font-medium text-content mb-1" data-i18n="labelJsonFile"></label>
          <div class="flex items-center gap-2">
            <input type="file" id="fileinput-json" accept=".json"
              class="block w-full text-sm text-muted file:mr-3 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-accent-50 file:text-accent-700 hover:file:bg-accent-100">
          </div>
          <p class="text-xs text-faint mt-1">Format: [{"title": "...", "page": 1}, ...]</p>
        </div>

        <button id="btn-generate-b" onclick="generateB()"
          class="w-full py-2.5 px-4 bg-accent-600 text-white text-sm font-medium rounded-md hover:bg-accent-700 disabled:bg-line disabled:cursor-not-allowed transition-colors"
          data-i18n="btnGenerate"></button>
      </div>
    </div>

    </div><!-- /Form column -->

    <!-- Live TOC preview: renders the table-of-contents pages only, so it
         stays fast no matter how large the selected PDFs are. -->
    <aside class="mt-8 lg:mt-0 lg:sticky lg:top-8">
      <div class="rounded-lg border border-line bg-raised overflow-hidden">
        <div class="flex items-center justify-between gap-2 px-3 py-2 border-b border-line">
          <span class="text-xs font-semibold uppercase tracking-wide text-muted" data-i18n="previewHeading"></span>
          <label class="flex items-center gap-1.5 text-xs text-faint cursor-pointer select-none">
            <input type="checkbox" id="auto-preview" checked onchange="onAutoPreviewToggle()">
            <span data-i18n="autoPreview"></span>
          </label>
        </div>

        <div class="relative bg-surface" style="height: 540px;">
          <iframe id="preview-frame" class="w-full h-full hidden" title="TOC preview"></iframe>
          <div id="preview-placeholder" class="absolute inset-0 flex flex-col items-center justify-center gap-1 px-6 text-center">
            <svg class="h-8 w-8 text-faint mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25M9 16.5v.75m3-3v3M15 12v5.25m-4.5-15H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
            </svg>
            <p class="text-sm text-muted" id="preview-placeholder-title" data-i18n="previewEmptyTitle"></p>
            <p class="text-xs text-faint" id="preview-placeholder-hint" data-i18n="previewEmptyHint"></p>
          </div>
        </div>

        <div class="flex items-center justify-between gap-2 px-3 py-2 border-t border-line">
          <span id="preview-status" class="text-xs text-faint truncate">—</span>
          <div class="flex items-center gap-3 shrink-0">
            <a id="preview-open" href="#" target="_blank" rel="noopener"
               class="text-xs text-accent-500 hover:text-accent-600 transition-colors hidden" data-i18n="previewOpenTab"></a>
            <button onclick="renderPreview()" class="text-xs text-accent-500 hover:text-accent-600 transition-colors" data-i18n="previewRefresh"></button>
          </div>
        </div>
      </div>
    </aside>
    </div><!-- /Grid -->

    <!-- Footer -->
    <div class="mt-12 pt-4 border-t border-line text-center text-xs text-faint">
      <p class="mt-1">PDF Table of Content Service · <a href="/" class="text-accent-500 hover:text-accent-600 transition-colors" data-i18n="serverVersionLink"></a></p>
    </div>
  </div>

  <script src="/static/fontkit.umd.min.js"></script>
  <script src="/static/pdf-lib.min.js"></script>
  <script>
  // ══════════════════════════════════════════════════════════════════
  // i18n
  // ══════════════════════════════════════════════════════════════════

  const i18n = {
    de: {
      title: 'PDF Inhaltsverzeichnis Generator',
      localModeSubtitle: 'Lokale Version \u2013 l\u00e4uft komplett im Browser, kein Server n\u00f6tig',
      previewHeading: 'Vorschau',
      autoPreview: 'Automatisch',
      previewRefresh: 'Aktualisieren',
      previewOpenTab: 'In neuem Tab \u00f6ffnen',
      previewEmptyTitle: 'Noch keine Vorschau',
      previewEmptyHint: 'Dateien hinzuf\u00fcgen, um das Inhaltsverzeichnis zu sehen',
      previewMergeOnlyTitle: 'Kein Inhaltsverzeichnis',
      previewMergeOnlyHint: 'Im Modus \u201eNur zusammenf\u00fchren\u201c wird keine Verzeichnisseite erzeugt',
      previewErrorTitle: 'Vorschau fehlgeschlagen',
      previewRendering: 'Vorschau wird erstellt\u2026',

  function handleFilesA(fileList) { addFilesA(Array.from(fileList).filter(f => f.name.toLowerCase().endsWith('.pdf'))); }
  function addFilesA(files) { selectedFilesA = [...selectedFilesA, ...files]; renderFileListA(); }
  function removeFileA(i) { selectedFilesA.splice(i, 1); renderFileListA(); }
  function clearFilesA() { selectedFilesA = []; renderFileListA(); document.getElementById('fileinput-a').value = ''; }
  function sortFilesA(order) { selectedFilesA.sort((a, b) => { const na = a.name.toLowerCase(), nb = b.name.toLowerCase(); return order === 'az' ? na.localeCompare(nb) : nb.localeCompare(na); }); renderFileListA(); }
  function moveFileA(from, to) { if (to < 0 || to >= selectedFilesA.length) return; const [item] = selectedFilesA.splice(from, 1); selectedFilesA.splice(to, 0, item); renderFileListA(); }

  let dragFromIndex = null;

  function renderFileListA() {
    const list = document.getElementById('files-a'), container = document.getElementById('filelist-a');
    const btn = document.getElementById('btn-generate-a'), hint = document.getElementById('drag-hint');
    if (selectedFilesA.length === 0) { container.classList.add('hidden'); btn.disabled = true; schedulePreview(); return; }

    if (hint) hint.textContent = selectedFilesA.length > 1 ? (currentLang === 'de' ? '\u2195 Dateien per Drag & Drop oder Pfeile umsortieren' : '\u2195 Drag & drop or use arrows to reorder files') : '';
    list.innerHTML = selectedFilesA.map((f, i) => `
      <li class="file-item flex items-center px-2 py-1.5 bg-raised rounded border border-line text-sm gap-1"
          draggable="true" data-index="${i}"
          ondragstart="onDragStartFile(event,${i})" ondragover="onDragOverFile(event,${i})"
          ondragleave="onDragLeaveFile(event)" ondrop="onDropFile(event,${i})" ondragend="onDragEndFile(event)">
        <span class="drag-handle text-faint hover:text-content px-1 text-base" title="Drag to reorder">\u2630</span>
        <span class="text-content truncate flex-1 min-w-0">${escapeHtml(f.name)}</span>

  function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function onDragStartFile(e, i) { dragFromIndex = i; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', i); }
  function onDragOverFile(e, i) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; document.querySelectorAll('#files-a .file-item').forEach(el => el.classList.remove('drag-over-item')); if (dragFromIndex !== null && dragFromIndex !== i) e.currentTarget.classList.add('drag-over-item'); }

  // ══════════════════════════════════════════════════════════════════

  // ══════════════════════════════════════════════════════════════════

  const colorRe = /^#[0-9A-Fa-f]{6}$/;

  function validateColor(color) {
    color = (color || '').trim();
    if (!color.startsWith('#')) color = '#' + color;
    return colorRe.test(color) ? color.toUpperCase() : '#1A2980';
  }

  function cleanTitle(filename) {
    let name = filename.replace(/\.[^.]+$/, '');
    name = name.replace(/_/g, ' ').replace(/-/g, ' \u2013 ');
    name = name.replace(/^\d+[\s\-_.]+/, '');
    return name.trim();
  }

  const MAX_ENTRY_TITLE_LEN = 80;
  function truncateEntry(title) {
    if ([...title].length <= MAX_ENTRY_TITLE_LEN) return title;
    return [...title].slice(0, MAX_ENTRY_TITLE_LEN).join('') + '...';
  }

  const unsafeFilenameRe = /[<>:"/\\|?*]/g;
  function titleToFilename(title) {
    let name = title.replace(unsafeFilenameRe, '').trim();
    return name ? name + '.pdf' : 'ausgabe.pdf';
  }

  const lowercaseWords = new Set(['und','oder','f\u00fcr','von','mit','im','am','an']);
  function folderToTitle(folderName) {
    let title = folderName.replace(/_/g, ' ').replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
    const words = title.split(/\s+/);
    if (words.length === 0) return 'Inhaltsverzeichnis';
    const result = words.map((w, i) => {
      if (i === 0 || !lowercaseWords.has(w.toLowerCase())) return capitalize(w);
      return w.toLowerCase();
    });
    title = result.join(' ');
    title = title.replace(/\bAus und\b/g, 'Aus- und');
    return title;
  }

  function capitalize(s) {
    if (!s) return s;
    return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
  }

  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    const r = parseInt(hex.substring(0, 2), 16) / 255;
    const g = parseInt(hex.substring(2, 4), 16) / 255;
    const b = parseInt(hex.substring(4, 6), 16) / 255;
    return PDFLib.rgb(r, g, b);
  }

  function lightenColor(hex, amount) {
    hex = hex.replace('#', '');
    let r = parseInt(hex.substring(0, 2), 16);
    let g = parseInt(hex.substring(2, 4), 16);
    let b = parseInt(hex.substring(4, 6), 16);
    r = Math.min(255, Math.round(r + (255 - r) * amount));
    g = Math.min(255, Math.round(g + (255 - g) * amount));
    b = Math.min(255, Math.round(b + (255 - b) * amount));
    return PDFLib.rgb(r / 255, g / 255, b / 255);
  }

  function coalesce(...vals) { for (const v of vals) if (v) return v; return ''; }

  // ══════════════════════════════════════════════════════════════════
  // Font loading
  // ══════════════════════════════════════════════════════════════════

  const FONT_URLS = {
    'IBM Plex Sans': {
      regular: '/fonts/IBMPlexSans/IBMPlexSans-Regular.otf',
      bold:    '/fonts/IBMPlexSans/IBMPlexSans-Bold.otf',
    },
    'Inter': {
      regular: '/fonts/Inter/Inter-Regular.otf',
      bold:    '/fonts/Inter/Inter-Bold.otf',
    },
    'Roboto': {
      regular: '/fonts/Roboto/Roboto-Regular.ttf',
      bold:    '/fonts/Roboto/Roboto-Bold.ttf',
    },
  };

  const fontCache = new Map();

  async function loadFontPair(fontName) {
    if (fontCache.has(fontName)) return fontCache.get(fontName);
    const urls = FONT_URLS[fontName];
    if (!urls) return null;
    try {
      const [regularBuf, boldBuf] = await Promise.all([
        fetch(urls.regular).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }),
        fetch(urls.bold).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }),
      ]);
      const pair = { regular: regularBuf, bold: boldBuf };
      fontCache.set(fontName, pair);
      return pair;
    } catch {
      return null;
    }
  }

  // ══════════════════════════════════════════════════════════════════
  // Bookmark extraction from source PDFs
  // ══════════════════════════════════════════════════════════════════

  function extractOutline(pdfDoc) {
    try {
      const catalog = pdfDoc.catalog;
      const outlinesRef = catalog.get(PDFLib.PDFName.of('Outlines'));
      if (!outlinesRef) return [];
      const outlines = pdfDoc.context.lookup(outlinesRef);
      if (!outlines) return [];

      const pages = pdfDoc.getPages();
      const pageRefs = pages.map((_, i) => pdfDoc.getPage(i).ref);
      const pageRefMap = new Map();
      pageRefs.forEach((ref, i) => pageRefMap.set(ref.toString(), i));

      function getPageIndex(dest) {
        if (!dest) return 0;
        let resolved = dest;
        if (dest instanceof PDFLib.PDFRef) {
          resolved = pdfDoc.context.lookup(dest);
        }
        if (resolved instanceof PDFLib.PDFArray) {
          const pageRef = resolved.get(0);
          if (pageRef instanceof PDFLib.PDFRef) {
            const key = pageRef.toString();
            if (pageRefMap.has(key)) return pageRefMap.get(key);
          }
        }
        return 0;
      }

      function readItems(firstRef) {
        const items = [];
        let ref = firstRef;
        const visited = new Set();
        while (ref) {
          const refKey = ref.toString();
          if (visited.has(refKey)) break;
          visited.add(refKey);
          const item = pdfDoc.context.lookup(ref);
          if (!item) break;

          let title = '';
          const titleObj = item.get(PDFLib.PDFName.of('Title'));
          if (titleObj) {
            const resolved = titleObj instanceof PDFLib.PDFRef ? pdfDoc.context.lookup(titleObj) : titleObj;
            if (resolved && typeof resolved.decodeText === 'function') title = resolved.decodeText();
            else if (resolved && typeof resolved.asString === 'function') title = resolved.asString();
          }

          let page = 0;
          const dest = item.get(PDFLib.PDFName.of('Dest'));
          if (dest) {
            const resolvedDest = dest instanceof PDFLib.PDFRef ? pdfDoc.context.lookup(dest) : dest;
            page = getPageIndex(resolvedDest);
          } else {
            const action = item.get(PDFLib.PDFName.of('A'));
            if (action) {
              const actionObj = action instanceof PDFLib.PDFRef ? pdfDoc.context.lookup(action) : action;
              if (actionObj) {
                const d = actionObj.get(PDFLib.PDFName.of('D'));
                if (d) {
                  const rd = d instanceof PDFLib.PDFRef ? pdfDoc.context.lookup(d) : d;
                  page = getPageIndex(rd);
                }
              }
            }
          }

          let children = [];
          const firstChild = item.get(PDFLib.PDFName.of('First'));
          if (firstChild) children = readItems(firstChild);

          items.push({ title, page, children });

          const next = item.get(PDFLib.PDFName.of('Next'));
          ref = next instanceof PDFLib.PDFRef ? next : null;
        }
        return items;
      }

      const firstRef = outlines.get(PDFLib.PDFName.of('First'));
      if (!firstRef) return [];
      return readItems(firstRef);
    } catch {
      return [];
    }
  }

  function distributeOutline(sourceOutline, entries) {
    if (!sourceOutline || sourceOutline.length === 0) return;
    function assign(items) {
      for (const item of items) {
        const bookmarkPage = item.page;
        for (let i = 0; i < entries.length; i++) {
          const start = entries[i].page - 1;
          const end = (i + 1 < entries.length) ? entries[i + 1].page - 1 : Infinity;
          if (bookmarkPage >= start && bookmarkPage < end) {
            if (!entries[i].sourceOutline) entries[i].sourceOutline = [];
            entries[i].sourceOutline.push({ title: item.title, page: bookmarkPage - start, children: [] });
            break;
          }
        }
        if (item.children && item.children.length > 0) assign(item.children);
      }
    }
    assign(sourceOutline);
  }

  // ══════════════════════════════════════════════════════════════════
  // TOC layout constants (from toc_engine.go)
  // ══════════════════════════════════════════════════════════════════

  const PAGE_WIDTH = 595.28;
  const PAGE_HEIGHT = 841.89;
  const TOP_MARGIN = 56.69;
  const BOTTOM_MARGIN = 56.69;
  const LEFT_MARGIN = 70.87;
  const RIGHT_MARGIN = 70.87;
  const RIGHT_EDGE = PAGE_WIDTH - RIGHT_MARGIN;
  const LINE_HEIGHT = 30.5;
  const LINK_SHIFT_UP = 6.0;
  const SECTION_LINE_HEIGHT = 2.83;

  const TITLE_BLOCK_OFFSETS = {
    'T_T_T': 126.3, 'T_T_F': 99.3, 'T_F_T': 82.3, 'T_F_F': 53.3,
    'F_T_T': 105.3, 'F_T_F': 78.3, 'F_F_T': 64.3, 'F_F_F': 37.3,
  };

  function computeTitleBlock(hasTitle, hasSubtitle, showLines) {
    const key = `${showLines?'T':'F'}_${hasTitle?'T':'F'}_${hasSubtitle?'T':'F'}`;
    return TITLE_BLOCK_OFFSETS[key] || 37.3;
  }

  // ══════════════════════════════════════════════════════════════════
  // Iterative TOC page count convergence
  // ══════════════════════════════════════════════════════════════════

  function calculateLayout(entries, opts) {
    const hasTitle = !!opts.title;
    const hasSubtitle = !!opts.subtitle;
    const titleBlock = computeTitleBlock(hasTitle, hasSubtitle, opts.showLines);
    const usableHeight = PAGE_HEIGHT - TOP_MARGIN - BOTTOM_MARGIN;

    // Entries per first page (with title block)
    const entriesFirstPage = Math.floor((usableHeight - titleBlock) / LINE_HEIGHT);
    // Entries per subsequent pages (no title block)
    const titleBlockSubsequent = computeTitleBlock(false, false, false);
    const entriesPerSubsequentPage = Math.floor((usableHeight - titleBlockSubsequent) / LINE_HEIGHT);

    let tocPagesGuess = 1;

    for (let iter = 0; iter < 5; iter++) {
      // Compute display page numbers based on guess
      if (opts.jsonMode) {
        for (let i = 0; i < entries.length; i++) {
          entries[i].displayPage = entries[i].page + tocPagesGuess;
          entries[i].finalPage = entries[i].page + tocPagesGuess;
        }
      } else {
        let currentPage = tocPagesGuess + 1;
        for (let i = 0; i < entries.length; i++) {
          entries[i].displayPage = currentPage;
          entries[i].finalPage = currentPage;
          currentPage += entries[i].pages;
        }
      }

      // How many TOC pages do we actually need?
      const n = entries.length;
      let actualPages;
      if (n <= entriesFirstPage) {
        actualPages = 1;
      } else {
        const remaining = n - entriesFirstPage;
        actualPages = 1 + Math.ceil(remaining / entriesPerSubsequentPage);
      }

      if (actualPages === tocPagesGuess) break;
      tocPagesGuess = actualPages;
    }

    return {
      tocPages: tocPagesGuess,
      entriesFirstPage,
      entriesPerSubsequentPage,
      titleBlock,
      titleBlockSubsequent,
    };
  }

  // ══════════════════════════════════════════════════════════════════
  // TOC page drawing with pdf-lib
  // ══════════════════════════════════════════════════════════════════

  async function createTocDocument(entries, opts, layout) {
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const tocDoc = await PDFDocument.create();
    if (typeof fontkit !== 'undefined') tocDoc.registerFontkit(fontkit);

    // Load fonts
    let fontRegular, fontBold;
    const fontPair = await loadFontPair(opts.font);
    if (fontPair) {
      fontRegular = await tocDoc.embedFont(fontPair.regular);
      fontBold = await tocDoc.embedFont(fontPair.bold);
    } else {
      fontRegular = await tocDoc.embedFont(StandardFonts.Helvetica);
      fontBold = await tocDoc.embedFont(StandardFonts.HelveticaBold);
    }

    const bgColor = validateColor(opts.bgColor);
    const lineColor = validateColor(opts.lineColor);
    const fontColor = validateColor(opts.fontColor);
    const fontColorRgb = hexToRgb(fontColor);
    const lineColorRgb = hexToRgb(lineColor);
    const dotColor = rgb(140/255, 140/255, 140/255);

    const subtitleColor = (fontColor !== '#000000')
      ? lightenColor(fontColor, 0.3)
      : rgb(80/255, 80/255, 80/255);

    const { tocPages, entriesFirstPage, entriesPerSubsequentPage, titleBlock, titleBlockSubsequent } = layout;

    let entryIndex = 0;

    for (let pageNum = 0; pageNum < tocPages; pageNum++) {
      const page = tocDoc.addPage([PAGE_WIDTH, PAGE_HEIGHT]);
      const isFirstPage = pageNum === 0;
      const isLastPage = pageNum === tocPages - 1;
      const currentTitleBlock = isFirstPage ? titleBlock : titleBlockSubsequent;
      const entriesThisPage = isFirstPage ? entriesFirstPage : entriesPerSubsequentPage;

      // Background fill
      if (bgColor !== '#FFFFFF') {
        page.drawRectangle({
          x: 0, y: 0, width: PAGE_WIDTH, height: PAGE_HEIGHT,
          color: hexToRgb(bgColor),
        });
      }

      let yPos = PAGE_HEIGHT - TOP_MARGIN;

      // First page: top section line, title, subtitle
      if (isFirstPage) {
        // v(0.5cm) = ~14.17pt initial offset
        yPos -= 14.17;

        // Top section line
        if (opts.showLines) {
          page.drawRectangle({
            x: LEFT_MARGIN, y: yPos - SECTION_LINE_HEIGHT,
            width: RIGHT_EDGE - LEFT_MARGIN, height: SECTION_LINE_HEIGHT,
            color: lineColorRgb,
            borderWidth: 0,
          });
          yPos -= SECTION_LINE_HEIGHT;
        }

        // Title
        if (opts.title) {
          yPos -= 11.34; // v(0.4cm)
          const titleFontSize = 15.4; // 1.4em of 11pt
          page.drawText(opts.title, {
            x: LEFT_MARGIN, y: yPos - titleFontSize,
            size: titleFontSize, font: fontBold, color: fontColorRgb,
            maxWidth: RIGHT_EDGE - LEFT_MARGIN,
          });
          yPos -= titleFontSize + 2;
        }

        // Subtitle
        if (opts.subtitle) {
          yPos -= 4.25; // v(0.15cm)
          const subtitleFontSize = 12.1; // 1.1em of 11pt
          page.drawText(opts.subtitle, {
            x: LEFT_MARGIN, y: yPos - subtitleFontSize,
            size: subtitleFontSize, font: fontRegular, color: subtitleColor,
            maxWidth: RIGHT_EDGE - LEFT_MARGIN,
          });
          yPos -= subtitleFontSize + 2;
        }

        // v(0.8cm) = ~22.68pt spacing before entries
        yPos -= 22.68;
      } else {
        // Subsequent pages: small top spacing
        yPos -= 14.17;
      }

      // Draw entries
      const entryFontSize = 9;
      const startY = PAGE_HEIGHT - TOP_MARGIN - currentTitleBlock;

      for (let e = 0; e < entriesThisPage && entryIndex < entries.length; e++, entryIndex++) {
        const entry = entries[entryIndex];
        const displayTitle = truncateEntry(entry.title);
        const displayPage = String(entry.displayPage);

        const entryY = startY - e * LINE_HEIGHT;

        // Draw title text
        page.drawText(displayTitle, {
          x: LEFT_MARGIN, y: entryY,
          size: entryFontSize, font: fontRegular, color: fontColorRgb,
        });

        // Draw page number (right-aligned)
        const pageNumWidth = fontRegular.widthOfTextAtSize(displayPage, entryFontSize);
        page.drawText(displayPage, {
          x: RIGHT_EDGE - pageNumWidth, y: entryY,
          size: entryFontSize, font: fontRegular, color: fontColorRgb,
        });

        // Draw dot leaders
        if (opts.dotLeaders) {
          const titleWidth = fontRegular.widthOfTextAtSize(displayTitle, entryFontSize);
          const dotsStart = LEFT_MARGIN + titleWidth + 4;
          const dotsEnd = RIGHT_EDGE - pageNumWidth - 4;
          if (dotsEnd > dotsStart + 10) {
            const dotStr = ' .';
            const dotWidth = fontRegular.widthOfTextAtSize(dotStr, entryFontSize);
            let dots = '';
            let w = 0;
            while (w + dotWidth < dotsEnd - dotsStart) {
              dots += dotStr;
              w += dotWidth;
            }
            if (dots) {
              page.drawText(dots, {
                x: dotsStart, y: entryY,
                size: entryFontSize, font: fontRegular, color: dotColor,
              });
            }
          }
        }
      }

      // Bottom section line on last page
      if (isLastPage && opts.showLines) {
        // v(0.8cm) after entries, then line
        const bottomY = TOP_MARGIN + SECTION_LINE_HEIGHT + 5;
        page.drawRectangle({
          x: LEFT_MARGIN, y: bottomY - SECTION_LINE_HEIGHT,
          width: RIGHT_EDGE - LEFT_MARGIN, height: SECTION_LINE_HEIGHT,
          color: lineColorRgb,
          borderWidth: 0,
        });
      }
    }

    return { tocDoc, fontRegular, fontBold };
  }

  // ══════════════════════════════════════════════════════════════════
  // Link annotations on TOC pages
  // ══════════════════════════════════════════════════════════════════

  function addTocLinks(tocDoc, entries, layout, totalTocPages) {
    const { titleBlock, titleBlockSubsequent, entriesFirstPage, entriesPerSubsequentPage } = layout;
    const pages = tocDoc.getPages();

    for (let i = 0; i < entries.length; i++) {
      const isFirstPage = Math.floor(i < entriesFirstPage ? 0 : 1 + Math.floor((i - entriesFirstPage) / entriesPerSubsequentPage));
      let tocPageIdx, entryOnPage;

      if (i < entriesFirstPage) {
        tocPageIdx = 0;
        entryOnPage = i;
      } else {
        const rem = i - entriesFirstPage;
        tocPageIdx = 1 + Math.floor(rem / entriesPerSubsequentPage);
        entryOnPage = rem % entriesPerSubsequentPage;
      }

      if (tocPageIdx >= totalTocPages) continue;

      const currentTitleBlock = tocPageIdx === 0 ? titleBlock : titleBlockSubsequent;
      const yTop = PAGE_HEIGHT - TOP_MARGIN - currentTitleBlock - entryOnPage * LINE_HEIGHT + LINK_SHIFT_UP;
      const yBottom = yTop - LINE_HEIGHT + 6;

      const targetPageIndex = entries[i].finalPage - 1; // 0-based
      if (targetPageIndex < 0 || targetPageIndex >= pages.length) continue;
      const targetPageRef = pages[targetPageIndex].ref;

      const tocPage = pages[tocPageIdx];
      const context = tocDoc.context;

      const annot = context.obj({
        Type: 'Annot',
        Subtype: 'Link',
        Rect: [LEFT_MARGIN, yBottom, RIGHT_EDGE, yTop],
        Border: [0, 0, 0],
        Dest: [targetPageRef, 'Fit'],
      });
      const annotRef = context.register(annot);

      const pageDict = tocPage.node;
      let annots = pageDict.get(PDFLib.PDFName.of('Annots'));
      if (annots) {
        if (annots instanceof PDFLib.PDFRef) annots = context.lookup(annots);
        annots.push(annotRef);
      } else {
        pageDict.set(PDFLib.PDFName.of('Annots'), context.obj([annotRef]));
      }
    }
  }

  // ══════════════════════════════════════════════════════════════════
  // Bookmark / outline creation
  // ══════════════════════════════════════════════════════════════════

  function addBookmarks(pdfDoc, entries, tocTitle) {
    const context = pdfDoc.context;
    const pages = pdfDoc.getPages();
    if (pages.length === 0) return;

    const catalog = pdfDoc.catalog;

    // Build child outline items for TOC entries
    const childRefs = [];
    const childDicts = [];

    for (let i = 0; i < entries.length; i++) {
      const entry = entries[i];
      const pageIdx = Math.min(entry.finalPage - 1, pages.length - 1);
      if (pageIdx < 0) continue;

      const ref = context.nextRef();
      childRefs.push(ref);

      // Build sub-children from source outline
      let subChildRefs = [];
      let subChildDicts = [];
      if (entry.sourceOutline && entry.sourceOutline.length > 0) {
        for (let j = 0; j < entry.sourceOutline.length; j++) {
          const sub = entry.sourceOutline[j];
          const subPageIdx = Math.min(pageIdx + sub.page, pages.length - 1);
          const subRef = context.nextRef();
          subChildRefs.push(subRef);
          subChildDicts.push({ ref: subRef, title: sub.title, pageIdx: subPageIdx });
        }
      }

      childDicts.push({
        ref, title: entry.title, pageIdx, subChildRefs, subChildDicts
      });
    }

    // Create Outlines dict
    const outlinesRef = context.nextRef();
    const topRef = context.nextRef();

    // Assign top-level item
    const topDict = {
      Type: 'Outlines',
      First: topRef,
      Last: topRef,
      Count: 1 + childRefs.length,
    };
    context.assign(outlinesRef, context.obj(topDict));

    // Build top bookmark (TOC title → page 1)
    const topItemDict = {
      Title: PDFLib.PDFHexString.fromText(tocTitle),
      Parent: outlinesRef,
      Dest: [pages[0].ref, 'Fit'],
    };

    if (childRefs.length > 0) {
      topItemDict.First = childRefs[0];
      topItemDict.Last = childRefs[childRefs.length - 1];
      topItemDict.Count = childRefs.length;
    }

    context.assign(topRef, context.obj(topItemDict));

    // Build entry bookmarks linked list
    for (let i = 0; i < childDicts.length; i++) {
      const cd = childDicts[i];
      const d = {
        Title: PDFLib.PDFHexString.fromText(cd.title),
        Parent: topRef,
        Dest: [pages[cd.pageIdx].ref, 'Fit'],
      };
      if (i > 0) d.Prev = childRefs[i - 1];
      if (i < childDicts.length - 1) d.Next = childRefs[i + 1];

      // Sub-children
      if (cd.subChildRefs.length > 0) {
        d.First = cd.subChildRefs[0];
        d.Last = cd.subChildRefs[cd.subChildRefs.length - 1];
        d.Count = cd.subChildRefs.length;

        for (let j = 0; j < cd.subChildDicts.length; j++) {
          const sc = cd.subChildDicts[j];
          const sd = {
            Title: PDFLib.PDFHexString.fromText(sc.title),
            Parent: cd.ref,
            Dest: [pages[Math.max(0, sc.pageIdx)].ref, 'Fit'],
          };
          if (j > 0) sd.Prev = cd.subChildRefs[j - 1];
          if (j < cd.subChildDicts.length - 1) sd.Next = cd.subChildRefs[j + 1];
          context.assign(cd.subChildRefs[j], context.obj(sd));
        }
      }

      context.assign(cd.ref, context.obj(d));
    }

    catalog.set(PDFLib.PDFName.of('Outlines'), outlinesRef);
  }

  // ══════════════════════════════════════════════════════════════════
  // JSON entry parsing (Mode B) — port of loadJSONEntries
  // ══════════════════════════════════════════════════════════════════

  function loadJSONEntries(jsonData, totalPages) {
    if (!Array.isArray(jsonData) || jsonData.length === 0) {
      throw new Error(currentLang === 'de' ? 'JSON muss eine nicht-leere Liste sein.' : 'JSON must be a non-empty array.');
    }

    const entries = [];
    for (let i = 0; i < jsonData.length; i++) {
      const item = jsonData[i];
      if (typeof item !== 'object' || item === null) {
        throw new Error(currentLang === 'de' ? `Eintrag ${i+1} ist ung\u00fcltig.` : `Entry ${i+1} is invalid.`);
      }
      if (!('title' in item) || !('page' in item)) {
        throw new Error(currentLang === 'de' ? `Eintrag ${i+1} braucht die Felder 'title' und 'page'.` : `Entry ${i+1} requires 'title' and 'page' fields.`);
      }
      if (typeof item.title !== 'string') {
        throw new Error(currentLang === 'de' ? `Eintrag ${i+1}: 'title' muss ein String sein.` : `Entry ${i+1}: 'title' must be a string.`);
      }
      const page = Number(item.page);
      if (!Number.isInteger(page)) {
        throw new Error(currentLang === 'de' ? `Eintrag ${i+1}: 'page' muss eine Ganzzahl sein.` : `Entry ${i+1}: 'page' must be an integer.`);
      }
      if (page < 1 || page > totalPages) {
        throw new Error(currentLang === 'de'
          ? `Eintrag ${i+1}: Seite ${page} liegt au\u00dferhalb des PDFs (1\u2013${totalPages}).`
          : `Entry ${i+1}: Page ${page} is out of range (1\u2013${totalPages}).`);
      }

      let pages;
      if ('pages' in item && item.pages !== undefined) {
        pages = Number(item.pages);
        if (!Number.isInteger(pages)) {
          throw new Error(currentLang === 'de' ? `Eintrag ${i+1}: 'pages' muss eine Ganzzahl sein.` : `Entry ${i+1}: 'pages' must be an integer.`);
        }
      } else if (i + 1 < jsonData.length) {
        pages = Number(jsonData[i + 1].page) - page;
      } else {
        pages = totalPages - page + 1;
      }

      entries.push({ title: item.title, page, pages, finalPage: 0, displayPage: 0, sourceOutline: [] });
    }
    return entries;
  }

  // ══════════════════════════════════════════════════════════════════
  // Read file as ArrayBuffer
  // ══════════════════════════════════════════════════════════════════

  function readFileAsArrayBuffer(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsArrayBuffer(file);
    });
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error);
      reader.readAsText(file);
    });
  }

  // ══════════════════════════════════════════════════════════════════
  // Generate Mode A (folder mode)
  // ══════════════════════════════════════════════════════════════════

  async function generateA() {
    if (selectedFilesA.length === 0) return;

    const btn = document.getElementById('btn-generate-a');
    const isMergeOnly = document.getElementById('merge-only-a').checked;
    btn.disabled = true;
    btn.textContent = t('btnGenerating');
    showProcessing(t('statusProcessing'));

    try {
      // Check total size
      const totalSize = selectedFilesA.reduce((sum, f) => sum + f.size, 0);
      if (totalSize > 200 * 1024 * 1024) {
        showProcessing(t('warnLargeFiles'));
      }

      const opts = collectOpts('a');
      const { title, subtitle, font } = opts;

      // Read all PDFs
      showProcessing(currentLang === 'de' ? 'PDFs werden geladen...' : 'Loading PDFs...');
      const pdfBuffers = [];
      const pdfDocs = [];
      const entries = [];

      for (let i = 0; i < selectedFilesA.length; i++) {
        const file = selectedFilesA[i];
        const buf = await readFileAsArrayBuffer(file);
        pdfBuffers.push(buf);

        let doc;
        try {
          doc = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
        } catch (e) {
          throw new Error(`${t('errorCorruptPdf')}: ${file.name}`);
        }
        pdfDocs.push(doc);

        const pageCount = doc.getPageCount();
        const outline = extractOutline(doc);

        entries.push({
          title: cleanTitle(file.name),
          pages: pageCount,
          page: 0,
          finalPage: 0,
          displayPage: 0,
          pdfBytes: buf,
          sourceOutline: outline,
        });
      }

      // Determine output filename
      const defaultLabel = t('defaultTocLabel');
      const outputFilename = title ? titleToFilename(title) : defaultLabel + '.pdf';

      if (isMergeOnly) {
        // Merge-only: no TOC page
        showProcessing(currentLang === 'de' ? 'PDFs werden zusammengef\u00fchrt...' : 'Merging PDFs...');

        const mergedDoc = await PDFLib.PDFDocument.create();
        if (typeof fontkit !== 'undefined') mergedDoc.registerFontkit(fontkit);
        let currentPage = 1;
        for (let i = 0; i < entries.length; i++) {
          entries[i].finalPage = currentPage;
          entries[i].displayPage = currentPage;
          const srcDoc = await PDFLib.PDFDocument.load(entries[i].pdfBytes, { ignoreEncryption: true });
          const copied = await mergedDoc.copyPages(srcDoc, srcDoc.getPageIndices());
          copied.forEach(p => mergedDoc.addPage(p));
          currentPage += entries[i].pages;
        }

        const bookmarkTitle = coalesce(title, subtitle, defaultLabel);
        addBookmarks(mergedDoc, entries, bookmarkTitle);

        const pdfBytes = await mergedDoc.save();
        showSuccess(new Blob([pdfBytes], { type: 'application/pdf' }), outputFilename);
        return;
      }

      // Full TOC mode
      showProcessing(t('fontLoading'));
      await loadFontPair(font); // preload into cache

      showProcessing(currentLang === 'de' ? 'Layout wird berechnet...' : 'Calculating layout...');
      const layout = calculateLayout(entries, opts);

      showProcessing(currentLang === 'de' ? 'Inhaltsverzeichnis wird erstellt...' : 'Creating table of contents...');
      const { tocDoc } = await createTocDocument(entries, opts, layout);

      // Merge content PDFs into tocDoc
      showProcessing(currentLang === 'de' ? 'PDFs werden zusammengef\u00fchrt...' : 'Merging PDFs...');
      for (const entry of entries) {
        const srcDoc = await PDFLib.PDFDocument.load(entry.pdfBytes, { ignoreEncryption: true });
        const copied = await tocDoc.copyPages(srcDoc, srcDoc.getPageIndices());
        copied.forEach(p => tocDoc.addPage(p));
      }

      // Add link annotations
      addTocLinks(tocDoc, entries, layout, layout.tocPages);

      // Add bookmarks
      const bookmarkTitle = coalesce(title, subtitle, defaultLabel);
      addBookmarks(tocDoc, entries, bookmarkTitle);

      const pdfBytes = await tocDoc.save();
      showSuccess(new Blob([pdfBytes], { type: 'application/pdf' }), outputFilename);

    } catch (err) {
      showError(err.message || t('errorUnknown'));
    } finally {
      btn.disabled = selectedFilesA.length === 0;
      btn.textContent = isMergeOnly ? t('btnMergeOnly') : t('btnGenerate');
    }
  }

  // ══════════════════════════════════════════════════════════════════
  // Generate Mode B (JSON mode)
  // ══════════════════════════════════════════════════════════════════

  async function generateB() {
    const pdfInput = document.getElementById('fileinput-pdf');
    const jsonInput = document.getElementById('fileinput-json');

    if (!pdfInput.files[0] || !jsonInput.files[0]) {
      showError(t('errorSelectBoth'));
      return;
    }

    const btn = document.getElementById('btn-generate-b');
    btn.disabled = true;
    btn.textContent = t('btnGenerating');
    showProcessing(t('statusProcessing'));

    try {
      const opts = collectOpts('b');
      const { title, subtitle, font } = opts;

      // Read files
      showProcessing(currentLang === 'de' ? 'Dateien werden geladen...' : 'Loading files...');
      const [pdfBuf, jsonText] = await Promise.all([
        readFileAsArrayBuffer(pdfInput.files[0]),
        readFileAsText(jsonInput.files[0]),
      ]);

      // Parse JSON
      let jsonData;
      try {
        jsonData = JSON.parse(jsonText);
      } catch (e) {
        throw new Error(`${t('errorInvalidJson')}: ${e.message}`);
      }

      // Load source PDF
      let srcDoc;
      try {
        srcDoc = await PDFLib.PDFDocument.load(pdfBuf, { ignoreEncryption: true });
      } catch (e) {
        throw new Error(`${t('errorCorruptPdf')}: ${pdfInput.files[0].name}`);
      }
      const totalPages = srcDoc.getPageCount();

      // Parse entries
      const entries = loadJSONEntries(jsonData, totalPages);

      // Extract and distribute source bookmarks
      const sourceOutline = extractOutline(srcDoc);
      distributeOutline(sourceOutline, entries);

      // Output filename
      let outputFilename;
      if (title) {
        outputFilename = titleToFilename(title);
      } else {
        const pdfName = pdfInput.files[0].name.replace(/\.[^.]+$/, '');
        outputFilename = titleToFilename(folderToTitle(pdfName));
      }

      // Load fonts
      showProcessing(t('fontLoading'));
      await loadFontPair(font);

      showProcessing(currentLang === 'de' ? 'Layout wird berechnet...' : 'Calculating layout...');
      const layout = calculateLayout(entries, opts);

      showProcessing(currentLang === 'de' ? 'Inhaltsverzeichnis wird erstellt...' : 'Creating table of contents...');
      const { tocDoc } = await createTocDocument(entries, opts, layout);

      // Merge source PDF after TOC
      showProcessing(currentLang === 'de' ? 'PDFs werden zusammengef\u00fchrt...' : 'Merging PDFs...');
      const srcDocForCopy = await PDFLib.PDFDocument.load(pdfBuf, { ignoreEncryption: true });
      const copied = await tocDoc.copyPages(srcDocForCopy, srcDocForCopy.getPageIndices());
      copied.forEach(p => tocDoc.addPage(p));

      // Add link annotations
      addTocLinks(tocDoc, entries, layout, layout.tocPages);

      // Add bookmarks
      const bookmarkTitle = coalesce(title, subtitle, t('defaultTocLabel'));
      addBookmarks(tocDoc, entries, bookmarkTitle);

      const pdfBytes = await tocDoc.save();
      showSuccess(new Blob([pdfBytes], { type: 'application/pdf' }), outputFilename);

    } catch (err) {
      showError(err.message || t('errorUnknown'));
    } finally {
      btn.disabled = false;
      btn.textContent = t('btnGenerate');
    }
  }

  // ══════════════════════════════════════════════════════════════════
  // Live TOC preview
  //
  // Renders ONLY the table-of-contents pages via createTocDocument — never
  // the merged output — so a re-render costs the same whether the user
  // picked 2 MB or 200 MB of source PDFs. Page counts are cached per File
  // so repeated renders never re-parse an upload.
  // ══════════════════════════════════════════════════════════════════

  const PREVIEW_DEBOUNCE_MS = 400;
  const pageCountCache = new WeakMap(); // File -> page count
  const jsonTextCache = new WeakMap();  // File -> raw text
  let previewUrl = null;                // active blob URL, revoked on replace
  let previewTimer = null;
  let previewRun = 0;                   // guards against out-of-order renders

  function setPreviewStatus(text) {
    document.getElementById('preview-status').textContent = text;
  }

  function showPreviewPlaceholder(titleKey, hintKey, rawHint) {
    const titleEl = document.getElementById('preview-placeholder-title');
    const hintEl = document.getElementById('preview-placeholder-hint');
    titleEl.setAttribute('data-i18n', titleKey);
    titleEl.textContent = t(titleKey);
    if (rawHint !== undefined) {
      // Error text is already-resolved prose, so keep applyTranslations off it
      hintEl.removeAttribute('data-i18n');
      hintEl.textContent = rawHint;
    } else {
      hintEl.setAttribute('data-i18n', hintKey);
      hintEl.textContent = t(hintKey);
    }
    document.getElementById('preview-placeholder').classList.remove('hidden');
    document.getElementById('preview-frame').classList.add('hidden');
    document.getElementById('preview-open').classList.add('hidden');
  }

  function schedulePreview() {
    if (!document.getElementById('auto-preview').checked) return;
    clearTimeout(previewTimer);
    setPreviewStatus(t('previewStale'));
    previewTimer = setTimeout(renderPreview, PREVIEW_DEBOUNCE_MS);
  }

  function onAutoPreviewToggle() {
    if (document.getElementById('auto-preview').checked) {
      renderPreview();
    } else {
      clearTimeout(previewTimer);
      setPreviewStatus(t('previewPaused'));
    }
  }

  async function getPageCount(file) {
    if (pageCountCache.has(file)) return pageCountCache.get(file);
    const buf = await readFileAsArrayBuffer(file);
    const doc = await PDFLib.PDFDocument.load(buf, { ignoreEncryption: true });
    const count = doc.getPageCount();
    pageCountCache.set(file, count);
    return count;
  }

  async function getJsonText(file) {
    if (jsonTextCache.has(file)) return jsonTextCache.get(file);
    const text = await readFileAsText(file);
    jsonTextCache.set(file, text);
    return text;
  }

  // Shared with generateA/generateB so the preview can never drift from
  // what the download actually produces.
  function collectOpts(tab) {
    const showLines = document.getElementById(`lines-${tab}`).checked;
    return {
      title: document.getElementById(`title-${tab}`).value.trim(),
      subtitle: document.getElementById(`subtitle-${tab}`).value.trim(),
      font: document.getElementById(`font-${tab}`).value,
      dotLeaders: document.getElementById(`dots-${tab}`).checked,
      showLines,
      lineColor: showLines ? getSelectedColor(tab) : '#1A2980',
      bgColor: getSelectedBgColor(tab),
      fontColor: getSelectedFontColor(tab),
      jsonMode: tab === 'b',
    };
  }

  // Preview entries need titles and page counts only — no PDF bytes, and
  // no outline extraction, since neither affects the TOC pages.
  async function buildPreviewEntries(tab) {
    if (tab === 'a') {
      const entries = [];
      for (const file of selectedFilesA) {
        entries.push({
          title: cleanTitle(file.name),
          pages: await getPageCount(file),
          page: 0, finalPage: 0, displayPage: 0,
          sourceOutline: [],
        });
      }
      return entries;
    }

    const pdfFile = document.getElementById('fileinput-pdf').files[0];
    const jsonFile = document.getElementById('fileinput-json').files[0];
    if (!pdfFile || !jsonFile) return [];

    const totalPages = await getPageCount(pdfFile);
    let data;
    try {
      data = JSON.parse(await getJsonText(jsonFile));
    } catch (e) {
      throw new Error(`${t('errorInvalidJson')}: ${e.message}`);
    }
    return loadJSONEntries(data, totalPages);
  }

  async function renderPreview() {
    clearTimeout(previewTimer);
    const run = ++previewRun;
    const tab = currentTab;

    if (tab === 'a' && document.getElementById('merge-only-a').checked) {
      showPreviewPlaceholder('previewMergeOnlyTitle', 'previewMergeOnlyHint');
      setPreviewStatus('—');
      return;
    }

    try {
      const entries = await buildPreviewEntries(tab);
      if (run !== previewRun) return; // superseded while reading files

      if (entries.length === 0) {
        showPreviewPlaceholder('previewEmptyTitle', 'previewEmptyHint');
        setPreviewStatus('—');
        return;
      }

      setPreviewStatus(t('previewRendering'));
      const opts = collectOpts(tab);
      const layout = calculateLayout(entries, opts);
      const { tocDoc } = await createTocDocument(entries, opts, layout);
      const bytes = await tocDoc.save();
      if (run !== previewRun) return; // superseded while rendering

      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));

      const frame = document.getElementById('preview-frame');
      frame.src = previewUrl + '#toolbar=0&view=FitH';
      frame.classList.remove('hidden');
      document.getElementById('preview-placeholder').classList.add('hidden');

      // Fallback for browsers that refuse to render PDFs in an iframe
      const openLink = document.getElementById('preview-open');
      openLink.href = previewUrl;
      openLink.classList.remove('hidden');

      setPreviewStatus(t('previewReady')(layout.tocPages));
    } catch (err) {
      if (run !== previewRun) return;
      showPreviewPlaceholder('previewErrorTitle', null, err.message || t('errorUnknown'));
      setPreviewStatus('—');
    }
  }

  // One delegated pair of listeners per panel covers every text field,
  // select, checkbox and file input inside it.
  for (const panel of ['panel-a', 'panel-b']) {
    const el = document.getElementById(panel);
    el.addEventListener('input', schedulePreview);
    el.addEventListener('change', schedulePreview);
  }

  // ══════════════════════════════════════════════════════════════════
  // Init
  // ══════════════════════════════════════════════════════════════════

  applyStoredTheme();
  applyTranslations();
  updateLangButtons();
  initColorDropdown('a');  initColorDropdown('b');
  initBgColorDropdown('a'); initBgColorDropdown('b');
  initFontColorDropdown('a'); initFontColorDropdown('b');
  renderPreview(); // paints the empty-state placeholder
  </script>
</body>
</html>
