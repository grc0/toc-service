<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Table of Contents Generator</title>
  <link rel="icon" type="image/svg+xml" href="/static/logos/logo3a.svg">
  <script src="/static/tailwindcss.js"></script>
  <script>
    tailwind.config = {
      safelist: ['bg-accent-600', 'text-accent-600', 'border-accent-600', 'ring-accent-500'],
      theme: { extend: { colors: {
        accent: {
          50:'var(--c-accent-50)', 100:'var(--c-accent-100)', 500:'var(--c-accent-500)',
          600:'var(--c-accent-600)', 700:'var(--c-accent-700)', 800:'var(--c-accent-800)',
        },
        base: {
          50:'var(--c-base-50)', 100:'var(--c-base-100)', 200:'var(--c-base-200)',
          300:'var(--c-base-300)', 400:'var(--c-base-400)', 500:'var(--c-base-500)',
          600:'var(--c-base-600)', 700:'var(--c-base-700)', 800:'var(--c-base-800)', 900:'var(--c-base-900)',
        },
      }}}
    }
  </script>
  <style>
    /* Default: dark sidebar (standard Studio look) */
    :root {
      --c-accent-50:#ecfdf5;--c-accent-100:#d1fae5;--c-accent-500:#10b981;
      --c-accent-600:#059669;--c-accent-700:#047857;--c-accent-800:#065f46;
      --c-base-50:#fafafa;--c-base-100:#f4f4f5;--c-base-200:#e4e4e7;--c-base-300:#d4d4d8;
      --c-base-400:#a1a1aa;--c-base-500:#71717a;--c-base-600:#52525b;
      --c-base-700:#3f3f46;--c-base-800:#27272a;--c-base-900:#18181b;
      --c-sidebar-accent:#10b981;
    }
    .theme-light { --c-sidebar-accent:#059669; }

    /* Light-mode sidebar surface overrides */
    .theme-light aside {
      background:#ffffff !important; color:#18181b;
      border-color:#e4e4e7 !important;
    }
    .theme-light aside .border-zinc-800 { border-color:#e4e4e7; }
    .theme-light aside .border-zinc-700 { border-color:#d4d4d8; }
    .theme-light aside .bg-zinc-800 { background:#f4f4f5; }
    .theme-light aside .bg-zinc-900 { background:#ffffff; }
    .theme-light aside .bg-zinc-950 { background:#fafafa; }
    .theme-light aside .text-zinc-200 { color:#27272a; }
    .theme-light aside .text-zinc-300 { color:#3f3f46; }
    .theme-light aside .text-zinc-400 { color:#52525b; }
    .theme-light aside .text-zinc-500 { color:#71717a; }
    .theme-light aside .text-zinc-600 { color:#a1a1aa; }
    .theme-light aside .text-zinc-700 { color:#d4d4d8; }
    .theme-light aside .hover\:text-zinc-300:hover { color:#3f3f46; }
    .theme-light aside .hover\:text-zinc-200:hover { color:#18181b; }
    .theme-light aside .hover\:text-white:hover { color:#18181b; }
    .theme-light aside .hover\:bg-zinc-800:hover { background:#f4f4f5; }
    .theme-light .ipt { background:#ffffff; border-color:#d4d4d8; color:#18181b; }
    .theme-light .ipt::placeholder { color:#a1a1aa; }
    .theme-light .hex-input { background:#ffffff; border-color:#d4d4d8; color:#18181b; }
    .theme-light .hex-input::placeholder { color:#d4d4d8; }
    .theme-light .title-input { background:#ffffff; color:#18181b; }
    .theme-light .seg.active { background:#18181b; color:#ffffff; }
    .theme-light .file-row.editing { background:#f4f4f5; }
    .theme-light .drop-zone.drag-over { background:rgba(0,0,0,.04); }
    .theme-light .switch .slider { background:#e4e4e7; }
    .theme-light .switch input:checked + .slider:before { background:#ffffff; }
    .theme-light #divider { background:#e4e4e7; }
    .theme-light #divider:hover, .theme-light #divider.dragging { background:#059669; }
    .theme-light .file-row.has-custom .file-title { color:#059669; }
    .theme-light #btn-preview-mobile { background:#f4f4f5 !important; color:#18181b !important; border-color:#d4d4d8 !important; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    html, body { overflow: hidden; height: 100%; }
    .seg.active { background:#fff; color:#18181b; }
    .seg-accent { color: var(--c-sidebar-accent); }
    .ring-sidebar { box-shadow: 0 0 0 2px var(--c-sidebar-accent); }
    .file-item.dragging { opacity: .4; }
    .file-item.drag-over-item { border-top: 2px solid var(--c-sidebar-accent); }
    .drag-handle { cursor: grab; user-select: none; }
    .drag-handle:active { cursor: grabbing; }
    .drop-zone.drag-over { border-color: var(--c-sidebar-accent); background-color: rgba(255,255,255,.04); }
    .scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    .scroll::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* Sidebar input styling (dark) */
    .ipt {
      background: #18181b;
      border: 1px solid #3f3f46;
      color: #e4e4e7;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 16px;
      width: 100%;
      transition: border-color .15s, box-shadow .15s;
    }
    .ipt:focus { outline: none; border-color: var(--c-sidebar-accent); box-shadow: 0 0 0 1px var(--c-sidebar-accent); }
    .ipt::placeholder { color: #52525b; }

    .file-row.editing { background: #18181b; }
    .file-row.has-custom .file-title { color: var(--c-sidebar-accent); }
    .file-row .pencil {
      color: #71717a;
      padding: 4px; border-radius: 4px;
      transition: color .12s, background .12s;
      display: inline-flex; align-items: center;
    }
    .file-row .pencil:hover { background: #27272a; color: #fff; }
    .theme-light .file-row .pencil { color: #71717a; }
    .theme-light .file-row .pencil:hover { background: #e4e4e7; color: #18181b; }
    .title-input {
      background: #0a0a0a; border: 1px solid var(--c-sidebar-accent); color: #fff;
      border-radius: 3px; padding: 3px 6px; font-size: 15px;
      width: 100%; font-family: inherit;
    }
    .title-input:focus { outline: none; }

    /* Resizable sidebar (desktop only) */
    :root { --sidebar-w: 620px; }
    @media (min-width: 768px) {
      #sidebar {
        width: var(--sidebar-w);
        flex: 0 0 var(--sidebar-w);
        min-width: 380px;
        max-width: 80vw;
      }
      #divider {
        width: 4px; flex-shrink: 0;
        background: #18181b;
        cursor: col-resize;
        transition: background .12s;
        position: relative;
      }
      #divider:hover, #divider.dragging { background: var(--c-sidebar-accent); }
      #divider::after {
        content: ''; position: absolute; inset: 0 -4px;
      } /* widens hit-area without changing layout */
    }
    body.col-resizing { cursor: col-resize !important; user-select: none; }
    body.col-resizing iframe { pointer-events: none; }

    .hex-input {
      background: #18181b; border: 1px solid #3f3f46; color: #e4e4e7;
      border-radius: 4px; padding: 4px 7px; font-size: 13px;
      font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
      width: 100px; text-transform: uppercase;
    }
    .hex-input:focus { outline: none; border-color: var(--c-sidebar-accent); }
    .hex-input.invalid { border-color: #ef4444; }
    .hex-input.in-use { border-color: var(--c-sidebar-accent); }
    .hex-input::placeholder { color: #3f3f46; text-transform: none; }

    .color-row { display: flex; align-items: center; gap: 8px; }
    .color-row .c-label { flex: 0 0 100px; font-size: 15px; color: #d4d4d8; }
    .theme-light .color-row .c-label { color: #3f3f46; }

    /* Custom color dropdown */
    .cd { position: relative; flex: 1 1 auto; min-width: 0; }
    .cd-trigger {
      display: flex; align-items: center; gap: 6px;
      width: 100%; padding: 7px 10px;
      background: #18181b; border: 1px solid #3f3f46; color: #e4e4e7;
      border-radius: 6px; font-size: 15px; text-align: left;
      transition: border-color .12s, box-shadow .12s;
      cursor: pointer;
    }
    .cd-trigger.open, .cd-trigger:focus {
      outline: none; border-color: var(--c-sidebar-accent);
      box-shadow: 0 0 0 1px var(--c-sidebar-accent);
    }
    .cd-swatch {
      flex-shrink: 0; width: 14px; height: 14px; border-radius: 3px;
      border: 1px solid rgba(255,255,255,.15);
      background-color: #000;
    }
    .cd-swatch-custom {
      background: repeating-conic-gradient(#a1a1aa 0% 25%, #3f3f46 0% 50%) 50% / 8px 8px;
    }
    .cd-label-text {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cd-caret { color: #71717a; font-size: 10px; flex-shrink: 0; }
    .cd-menu {
      position: absolute; top: calc(100% + 4px); left: 0;
      min-width: 100%; max-width: 280px; max-height: 260px;
      overflow-y: auto; z-index: 30;
      background: #09090b; border: 1px solid #3f3f46; border-radius: 6px;
      padding: 4px 0; margin: 0; list-style: none;
      box-shadow: 0 12px 28px -8px rgba(0,0,0,.6);
    }
    .cd-menu.open-up { top: auto; bottom: calc(100% + 4px); }
    .cd-option {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; font-size: 15px; cursor: pointer;
      color: #d4d4d8; white-space: nowrap;
    }
    .cd-option:hover { background: #27272a; color: #fff; }
    .cd-option.selected { background: rgba(16,185,129,.14); color: #fff; }
    .cd-option .cd-swatch { width: 12px; height: 12px; }
    .cd-option .cd-hex {
      margin-left: auto; font-size: 12px; color: #71717a;
      font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
    }

    /* Light theme */
    .theme-light .cd-trigger { background: #ffffff; border-color: #d4d4d8; color: #18181b; }
    .theme-light .cd-swatch { border-color: rgba(0,0,0,.15); }
    .theme-light .cd-caret { color: #a1a1aa; }
    .theme-light .cd-menu { background: #ffffff; border-color: #d4d4d8; box-shadow: 0 12px 28px -8px rgba(0,0,0,.2); }
    .theme-light .cd-option { color: #3f3f46; }
    .theme-light .cd-option:hover { background: #f4f4f5; color: #18181b; }
    .theme-light .cd-option.selected { background: rgba(5,150,105,.12); color: #18181b; }
    .theme-light .cd-option .cd-hex { color: #a1a1aa; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 34px; height: 18px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; inset: 0; background: #3f3f46; border-radius: 999px;
      transition: background .15s; cursor: pointer;
    }
    .switch .slider:before {
      content: ''; position: absolute; top: 2px; left: 2px;
      height: 14px; width: 14px; background: #fff; border-radius: 50%;
      transition: transform .15s;
    }
    .switch input:checked + .slider { background: var(--c-sidebar-accent); }
    .switch input:checked + .slider:before { transform: translateX(16px); }
    .theme-mono .switch input:checked + .slider:before { background: #18181b; }

    /* Mobile sheet for preview */
    @media (max-width: 767px) {
      .preview-sheet {
        position: fixed; inset: 0; z-index: 50;
        transform: translateY(100%); transition: transform .25s ease;
        background: var(--c-base-100);
      }
      .preview-sheet.open { transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-zinc-950">

  <div class="flex flex-col md:flex-row h-screen">

    <!-- ───────── Sidebar ───────── -->
    <aside id="sidebar" class="w-full bg-zinc-900 text-zinc-200 flex flex-col h-full border-r border-zinc-800">

      <!-- Header -->
      <div class="px-4 py-3 border-b border-zinc-800 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 hover:opacity-80 transition">
          <img src="/static/logos/logo3a.svg" alt="" class="h-7 w-7">
          <p class="text-base font-semibold leading-tight" data-i18n="appTitle"></p>
        </a>
        <div class="flex items-center gap-1">
          <button onclick="setLang('en')" id="lang-en" class="px-1.5 py-0.5 text-[13px] font-medium rounded text-zinc-500">EN</button>
          <span class="text-zinc-700 text-base">|</span>
          <button onclick="setLang('de')" id="lang-de" class="px-1.5 py-0.5 text-[13px] font-medium rounded text-zinc-500">DE</button>
          <button onclick="toggleTheme()" id="theme-toggle"
            class="ml-1 p-1.5 rounded text-zinc-400 hover:text-white hover:bg-zinc-800 transition" title="Toggle dark/light">
            <svg id="theme-icon-sun" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
            </svg>
            <svg id="theme-icon-moon" class="h-4 w-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Mode segmented control -->
      <div class="px-4 py-3">
        <div class="grid grid-cols-2 gap-1 p-1 rounded-md bg-zinc-800 text-base font-medium">
          <button class="seg active py-2 rounded transition" data-mode="a" onclick="setMode('a')" data-i18n="modeA"></button>
          <button class="seg py-2 rounded text-zinc-400 transition" data-mode="b" onclick="setMode('b')" data-i18n="modeB"></button>
        </div>
      </div>

      <!-- Scrollable config -->
      <div class="flex-1 overflow-y-auto px-4 pb-4 space-y-5 scroll">

        <!-- ─── Mode A: file list ─── -->
        <section data-mode-panel="a">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-[13px] uppercase tracking-widest text-zinc-500" data-i18n="filesHeading"></h3>
            <span id="files-meta" class="text-[13px] text-zinc-500"></span>
          </div>
          <div id="dropzone" class="drop-zone border border-dashed border-zinc-700 rounded-md p-4 text-center text-base text-zinc-400 hover:border-zinc-500 cursor-pointer transition"
               onclick="document.getElementById('fileinput').click()">
            <span data-i18n="dropHere"></span> · <span class="text-[var(--c-sidebar-accent)] underline" data-i18n="browse"></span>
          </div>
          <input type="file" id="fileinput" multiple accept=".pdf" class="hidden" onchange="handleFiles(this.files)">
          <ul id="files" class="mt-2 space-y-0.5 text-base"></ul>
          <div id="files-actions" class="hidden mt-2 flex items-center justify-between text-[13px] text-zinc-500">
            <div class="flex items-center gap-1.5">
              <span data-i18n="sortLabel"></span>
              <button onclick="sortFiles('az')" class="px-1.5 py-0.5 rounded border border-zinc-700 hover:border-zinc-500 hover:text-zinc-300">A→Z</button>
              <button onclick="sortFiles('za')" class="px-1.5 py-0.5 rounded border border-zinc-700 hover:border-zinc-500 hover:text-zinc-300">Z→A</button>
            </div>
            <button onclick="clearFiles()" class="text-red-400 hover:text-red-300" data-i18n="removeAll"></button>
          </div>
        </section>

        <!-- ─── Mode B: PDF + JSON ─── -->
        <section data-mode-panel="b" class="hidden space-y-3">
          <div>
            <label class="block text-[13px] uppercase tracking-widest text-zinc-500 mb-1.5" data-i18n="labelPdfFile"></label>
            <input type="file" id="fileinput-pdf" accept=".pdf" onchange="onModeBChange()"
              class="block w-full text-base text-zinc-400 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-base file:bg-zinc-700 file:text-zinc-200 hover:file:bg-zinc-600">
          </div>
          <div>
            <label class="block text-[13px] uppercase tracking-widest text-zinc-500 mb-1.5" data-i18n="labelJsonFile"></label>
            <input type="file" id="fileinput-json" accept=".json" onchange="onModeBChange()"
              class="block w-full text-base text-zinc-400 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-base file:bg-zinc-700 file:text-zinc-200 hover:file:bg-zinc-600">
            <p class="text-[13px] text-zinc-600 mt-1 font-mono">[{"title": "...", "page": 1}]</p>
          </div>
        </section>

        <!-- ─── Heading ─── -->
        <section>
          <h3 class="text-[13px] uppercase tracking-widest text-zinc-500 mb-2" data-i18n="headingHeading"></h3>
          <input type="text" id="title" class="ipt" data-i18n-placeholder="placeholderTitle">
          <input type="text" id="subtitle" class="ipt mt-2" data-i18n-placeholder="placeholderSubtitle">
        </section>

        <!-- ─── Typography ─── -->
        <section>
          <h3 class="text-[13px] uppercase tracking-widest text-zinc-500 mb-2" data-i18n="typographyHeading"></h3>
          <select id="font" class="ipt">
            <option value="IBM Plex Sans">IBM Plex Sans</option>
            <option value="Inter">Inter</option>
            <option value="Roboto">Roboto</option>
          </select>
        </section>

        <!-- ─── Colors ─── -->
        <section>
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-[13px] uppercase tracking-widest text-zinc-500" data-i18n="colorsHeading"></h3>
            <button type="button" onclick="resetColors()" class="text-[13px] text-zinc-500 hover:text-zinc-200 underline-offset-2 hover:underline transition" data-i18n="btnResetColors"></button>
          </div>

          <div class="space-y-2">
            <div class="color-row">
              <span class="c-label" data-i18n="colorBar"></span>
              <div class="cd" id="cd-line">
                <button type="button" class="cd-trigger" onclick="toggleDropdown('line', event)">
                  <span class="cd-swatch"></span>
                  <span class="cd-label-text"></span>
                  <span class="cd-caret">▾</span>
                </button>
                <ul class="cd-menu hidden"></ul>
              </div>
              <input id="custom-line" type="text" maxlength="7" placeholder="#FF5500"
                     class="hex-input hidden" oninput="onCustomHex('line', this.value)">
            </div>
            <div class="color-row">
              <span class="c-label" data-i18n="colorText"></span>
              <div class="cd" id="cd-fc">
                <button type="button" class="cd-trigger" onclick="toggleDropdown('fc', event)">
                  <span class="cd-swatch"></span>
                  <span class="cd-label-text"></span>
                  <span class="cd-caret">▾</span>
                </button>
                <ul class="cd-menu hidden"></ul>
              </div>
              <input id="custom-fc" type="text" maxlength="7" placeholder="#333333"
                     class="hex-input hidden" oninput="onCustomHex('fc', this.value)">
            </div>
            <div class="color-row">
              <span class="c-label" data-i18n="colorBg"></span>
              <div class="cd" id="cd-bg">
                <button type="button" class="cd-trigger" onclick="toggleDropdown('bg', event)">
                  <span class="cd-swatch"></span>
                  <span class="cd-label-text"></span>
                  <span class="cd-caret">▾</span>
                </button>
                <ul class="cd-menu hidden"></ul>
              </div>
              <input id="custom-bg" type="text" maxlength="7" placeholder="#F3F4F6"
                     class="hex-input hidden" oninput="onCustomHex('bg', this.value)">
            </div>
          </div>
        </section>

        <!-- ─── Layout toggles ─── -->
        <section>
          <h3 class="text-[13px] uppercase tracking-widest text-zinc-500 mb-2" data-i18n="layoutHeading"></h3>
          <label class="flex items-center justify-between py-1.5 text-base cursor-pointer">
            <span class="text-zinc-300" data-i18n="labelDots"></span>
            <span class="switch"><input type="checkbox" id="dots" checked onchange="schedulePreview()"><span class="slider"></span></span>
          </label>
          <label class="flex items-center justify-between py-1.5 text-base cursor-pointer">
            <span class="text-zinc-300" data-i18n="labelLines"></span>
            <span class="switch"><input type="checkbox" id="lines" checked onchange="schedulePreview()"><span class="slider"></span></span>
          </label>
          <label class="flex items-center justify-between py-1.5 text-base cursor-pointer" data-mode-panel="a">
            <span class="text-zinc-300" data-i18n="labelMergeOnly"></span>
            <span class="switch"><input type="checkbox" id="merge-only" onchange="schedulePreview()"><span class="slider"></span></span>
          </label>
        </section>
      </div>

      <!-- Action bar -->
      <div class="px-4 py-3 border-t border-zinc-800 bg-zinc-950">
        <div class="flex items-center justify-between mb-2 text-[13px] text-zinc-500">
          <span id="preview-status">—</span>
          <span class="hidden md:inline">⌘ + ⏎</span>
        </div>
        <div class="flex gap-2">
          <button id="btn-preview-mobile" class="md:hidden flex-1 py-2 rounded text-base font-medium bg-zinc-800 text-zinc-200 border border-zinc-700"
                  onclick="openPreviewSheet()" data-i18n="btnShowPreview"></button>
          <button id="btn-generate" onclick="downloadCurrent()" disabled
            class="flex-1 py-2.5 rounded font-semibold text-base transition disabled:bg-zinc-700 disabled:text-zinc-500 disabled:cursor-not-allowed"
            style="background: var(--c-sidebar-accent); color: #18181b;"
            data-i18n="btnDownload"></button>
        </div>
      </div>

      <!-- Nav -->
      <nav class="px-4 py-2.5 border-t border-zinc-800 bg-zinc-950 flex items-center gap-3 text-[13px] text-zinc-500">
        <a href="/howto" class="hover:text-zinc-300 transition" data-i18n="navHowTo"></a>
        <a href="/usage" class="hover:text-zinc-300 transition" data-i18n="navUsage"></a>
        <a href="/local" class="ml-auto hover:text-zinc-300 transition" data-i18n="navLocal"></a>
      </nav>
    </aside>

    <!-- Resize handle (desktop only) -->
    <div id="divider" class="hidden md:block" title="Drag to resize · double-click to reset"></div>

    <!-- ───────── Preview canvas ───────── -->
    <main id="canvas" class="hidden md:flex flex-1 bg-base-100 flex-col preview-sheet md:relative md:transform-none">

      <div class="px-4 py-2.5 bg-white border-b border-base-200 flex items-center justify-between text-base">
        <div class="flex items-center gap-2 text-base-600 min-w-0">
          <span id="preview-dot" class="h-2 w-2 rounded-full bg-base-300 flex-shrink-0"></span>
          <span id="preview-label" data-i18n="previewIdle" class="truncate"></span>
        </div>
        <div class="flex items-center gap-3 flex-shrink-0">
          <span id="preview-info" class="text-base-400"></span>
          <button class="md:hidden flex items-center gap-1 px-3 py-1.5 -my-1 rounded-md bg-base-100 hover:bg-base-200 text-base-700 font-medium"
                  onclick="closePreviewSheet()" aria-label="Close preview">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
            </svg>
            <span data-i18n="btnClose"></span>
          </button>
        </div>
      </div>

      <div class="flex-1 relative bg-base-200">
        <!-- Empty state -->
        <div id="preview-empty" class="absolute inset-0 flex flex-col items-center justify-center text-center text-base-500 px-8">
          <svg class="h-14 w-14 text-base-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/>
          </svg>
          <p class="text-base" data-i18n="previewEmptyTitle"></p>
          <p class="text-base text-base-400 mt-1" data-i18n="previewEmptyHint"></p>
        </div>

        <!-- Loading overlay -->
        <div id="preview-loading" class="hidden absolute inset-0 z-10 flex items-center justify-center bg-base-200/70 backdrop-blur-sm">
          <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-white shadow text-base text-base-700">
            <svg class="animate-spin h-4 w-4 text-accent-600" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z"/>
            </svg>
            <span data-i18n="rendering"></span>
          </div>
        </div>

        <!-- Error -->
        <div id="preview-error" class="hidden absolute inset-0 flex items-center justify-center px-6">
          <div class="max-w-md w-full bg-red-50 border border-red-200 text-red-800 rounded-lg p-4 text-base">
            <p class="font-semibold mb-1" data-i18n="errorTitle"></p>
            <p id="preview-error-msg" class="text-red-700"></p>
          </div>
        </div>

        <!-- The PDF iframe -->
        <iframe id="preview-frame" class="absolute inset-0 w-full h-full bg-white" title="PDF preview"></iframe>
      </div>

      <div class="px-4 py-1.5 bg-white border-t border-base-200 text-[13px] text-base-500 flex items-center justify-between">
        <span id="footer-stats">—</span>
        <span data-i18n="autoPreview"></span>
      </div>
    </main>
  </div>

  <script>
    // ══════════════ i18n ══════════════
    const i18n = {
      en: {
        modeA: 'Multiple PDFs', modeB: 'PDF + JSON',
        filesHeading: 'Files', headingHeading: 'Heading', typographyHeading: 'Typography',
        colorsHeading: 'Colors', layoutHeading: 'Layout',
        colorBar: 'Bar', colorBg: 'Background', colorText: 'Text',
        labelDots: 'Dot leaders', labelLines: 'Decorative bars', labelMergeOnly: 'Merge only',
        dropHere: 'Drop PDFs', browse: 'browse', sortLabel: 'Sort', removeAll: 'Remove all',
        placeholderTitle: 'Title (optional)', placeholderSubtitle: 'Subtitle (optional)',
        labelPdfFile: 'PDF file', labelJsonFile: 'JSON entries',
        previewIdle: 'No preview yet', previewRendering: 'Rendering preview…',
        previewReady: 'Preview is current', previewStale: 'Changes pending — re-rendering…',
        previewEmptyTitle: 'Add files to see a live preview',
        previewEmptyHint: 'Every change re-renders the actual PDF',
        rendering: 'Rendering preview', errorTitle: 'Render failed',
        autoPreview: 'Auto-preview on change', btnDownload: 'Download PDF',
        btnShowPreview: 'Show preview', btnClose: 'Close',
        colorCustom: 'Custom…', btnResetColors: 'Reset',
        appTitle: 'PDF Table of Contents Generator',
        navHowTo: 'How-to', navUsage: 'Usage', navLocal: 'Browser-only mode →',
        statusFiles: (n, mb) => `${n} file${n===1?'':'s'} · ${mb}`,
        fallback: 'inhaltsverzeichnis.pdf',
      },
      de: {
        modeA: 'Mehrere PDFs', modeB: 'PDF + JSON',
        filesHeading: 'Dateien', headingHeading: 'Überschrift', typographyHeading: 'Typografie',
        colorsHeading: 'Farben', layoutHeading: 'Layout',
        colorBar: 'Balken', colorBg: 'Hintergrund', colorText: 'Text',
        labelDots: 'Punktlinie', labelLines: 'Zierbalken', labelMergeOnly: 'Nur zusammenführen',
        dropHere: 'PDFs ablegen', browse: 'durchsuchen', sortLabel: 'Sortieren', removeAll: 'Alle entfernen',
        placeholderTitle: 'Titel (optional)', placeholderSubtitle: 'Untertitel (optional)',
        labelPdfFile: 'PDF-Datei', labelJsonFile: 'JSON-Einträge',
        previewIdle: 'Noch keine Vorschau', previewRendering: 'Vorschau wird erstellt…',
        previewReady: 'Vorschau ist aktuell', previewStale: 'Änderungen offen — neu rendern…',
        previewEmptyTitle: 'Dateien hinzufügen für Live-Vorschau',
        previewEmptyHint: 'Jede Änderung rendert das echte PDF',
        rendering: 'Vorschau wird erstellt', errorTitle: 'Render-Fehler',
        autoPreview: 'Auto-Vorschau bei Änderung', btnDownload: 'PDF herunterladen',
        btnShowPreview: 'Vorschau anzeigen', btnClose: 'Schließen',
        colorCustom: 'Eigene…', btnResetColors: 'Zurücksetzen',
        appTitle: 'PDF Inhaltsverzeichnis-Generator',
        navHowTo: 'Anleitung', navUsage: 'Nutzung', navLocal: 'Browser-Modus →',
        statusFiles: (n, mb) => `${n} Datei${n===1?'':'en'} · ${mb}`,
        fallback: 'inhaltsverzeichnis.pdf',
      },
    };
    let currentLang = localStorage.getItem('toc-lang') || 'en';
    function t(k){ const v = i18n[currentLang]?.[k]; return v ?? i18n.en[k] ?? k; }
    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n'); const v = t(k);
        if (typeof v === 'string') el.textContent = v;
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
      });
      document.title = t('appTitle');
    }
    function setLang(l) {
      currentLang = l; localStorage.setItem('toc-lang', l);
      document.documentElement.lang = l;
      applyTranslations(); updateLangButtons(); updateStatus(); renderFileList();
      refreshColorLabels();
      schedulePreview();
    }
    function updateLangButtons() {
      const en = document.getElementById('lang-en'), de = document.getElementById('lang-de');
      const active = 'text-white bg-zinc-700', idle = 'text-zinc-500 hover:text-zinc-300';
      [en, de].forEach(b => b.className = b.className.replace(/text-\S+|bg-\S+|hover:text-\S+/g,'').trim());
      en.classList.add(...(currentLang==='en'?active.split(' '):idle.split(' ')));
      de.classList.add(...(currentLang==='de'?active.split(' '):idle.split(' ')));
      en.classList.add('px-1.5','py-0.5','text-[13px]','font-medium','rounded');
      de.classList.add('px-1.5','py-0.5','text-[13px]','font-medium','rounded');
    }

    // ══════════════ Theme (dark / light) ══════════════
    function toggleTheme() {
      const isLight = document.body.classList.toggle('theme-light');
      localStorage.setItem('toc-theme', isLight ? 'light' : 'dark');
      updateThemeIcon();
    }
    function applyStoredTheme() {
      const stored = localStorage.getItem('toc-theme');
      if (stored === 'light') {
        document.body.classList.add('theme-light');
      } else if (stored === 'mono' || stored === 'emerald') {
        // Old keys from the previous emerald/mono toggle — discard
        localStorage.removeItem('toc-theme');
      }
      updateThemeIcon();
    }
    function updateThemeIcon() {
      const isLight = document.body.classList.contains('theme-light');
      // Show the icon of what the next click will give you:
      //   dark mode → sun (click → light)
      //   light mode → moon (click → dark)
      document.getElementById('theme-icon-sun').classList.toggle('hidden', isLight);
      document.getElementById('theme-icon-moon').classList.toggle('hidden', !isLight);
    }

    // ══════════════ State ══════════════
    let mode = 'a';
    let selectedFiles = [];
    let pdfFile = null, jsonFile = null;
    const DEFAULT_COLORS = { line: '#1A2980', bg: '#FFFFFF', fc: '#000000' };
    const colors = {
      line: { selected: DEFAULT_COLORS.line },
      bg:   { selected: DEFAULT_COLORS.bg },
      fc:   { selected: DEFAULT_COLORS.fc },
    };

    function resetColors() {
      for (const group of ['line', 'bg', 'fc']) {
        colors[group].selected = DEFAULT_COLORS[group];
        const custom = document.getElementById('custom-' + group);
        custom.value = ''; custom.classList.add('hidden');
        custom.classList.remove('invalid', 'in-use');
        markSelected(group, DEFAULT_COLORS[group]);
        updateTrigger(group);
      }
      closeDropdowns();
      schedulePreview();
    }
    const PRESETS = {
      line: ['#1A2980','#000000','#2563EB','#0891B2','#059669','#65A30D','#CA8A04','#EA580C','#DC2626','#9333EA','#E84466','#4B5563','#FFFFFF'],
      bg:   ['#FFFFFF','#F3F4F6','#FFFBEB','#EFF6FF','#F0FDF4','#FDF2F8','#F5F3FF','#ECFDF5','#000000'],
      fc:   ['#000000','#FFFFFF','#1A2980','#2563EB','#0891B2','#059669','#DC2626','#9333EA','#4B5563'],
    };

    const COLOR_NAMES = {
      '#1A2980':'Navy','#000000':'Black','#FFFFFF':'White','#2563EB':'Blue',
      '#0891B2':'Teal','#059669':'Green','#65A30D':'Lime','#CA8A04':'Gold',
      '#EA580C':'Orange','#DC2626':'Red','#9333EA':'Purple','#E84466':'Pink',
      '#4B5563':'Gray',
      '#F3F4F6':'Light Gray','#FFFBEB':'Cream','#EFF6FF':'Light Blue',
      '#F0FDF4':'Light Green','#FDF2F8':'Light Pink','#F5F3FF':'Light Purple',
      '#ECFDF5':'Mint',
    };

    function initColorDropdown(group) {
      const cd = document.getElementById('cd-' + group);
      const menu = cd.querySelector('.cd-menu');
      menu.innerHTML = '';
      for (const hex of PRESETS[group]) {
        const li = document.createElement('li');
        li.className = 'cd-option';
        li.dataset.value = hex;
        li.innerHTML = `
          <span class="cd-swatch" style="background:${hex}"></span>
          <span>${COLOR_NAMES[hex] || hex}</span>
          <span class="cd-hex">${hex}</span>`;
        li.addEventListener('click', () => onOptionPick(group, hex));
        menu.appendChild(li);
      }
      const liCustom = document.createElement('li');
      liCustom.className = 'cd-option cd-option-custom';
      liCustom.dataset.value = '_custom';
      liCustom.innerHTML = `
        <span class="cd-swatch cd-swatch-custom"></span>
        <span class="cd-option-custom-label">${t('colorCustom')}</span>`;
      liCustom.addEventListener('click', () => onOptionPick(group, '_custom'));
      menu.appendChild(liCustom);

      markSelected(group, colors[group].selected);
      updateTrigger(group);
    }

    function updateTrigger(group) {
      const cd = document.getElementById('cd-' + group);
      const swatch = cd.querySelector('.cd-trigger .cd-swatch');
      const label = cd.querySelector('.cd-trigger .cd-label-text');
      const hex = colors[group].selected;
      swatch.style.background = hex;
      const name = COLOR_NAMES[hex];
      label.textContent = name ? `${name} (${hex})` : hex;
    }

    function markSelected(group, value) {
      const cd = document.getElementById('cd-' + group);
      cd.querySelectorAll('.cd-option').forEach(li => {
        li.classList.toggle('selected', li.dataset.value === value);
      });
    }

    function toggleDropdown(group, e) {
      if (e) e.stopPropagation();
      const cd = document.getElementById('cd-' + group);
      const menu = cd.querySelector('.cd-menu');
      const trigger = cd.querySelector('.cd-trigger');
      const wasOpen = !menu.classList.contains('hidden');
      closeDropdowns();
      if (wasOpen) return;
      // Flip up if not enough space below
      const rect = trigger.getBoundingClientRect();
      menu.classList.toggle('open-up', window.innerHeight - rect.bottom < 280);
      menu.classList.remove('hidden');
      trigger.classList.add('open');
    }

    function closeDropdowns() {
      document.querySelectorAll('.cd-menu').forEach(m => m.classList.add('hidden'));
      document.querySelectorAll('.cd-trigger').forEach(t => t.classList.remove('open'));
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('.cd')) closeDropdowns();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeDropdowns();
    });

    function onOptionPick(group, value) {
      closeDropdowns();
      const custom = document.getElementById('custom-' + group);
      if (value === '_custom') {
        custom.classList.remove('hidden');
        custom.focus();
        markSelected(group, '_custom');
      } else {
        custom.classList.add('hidden');
        custom.value = ''; custom.classList.remove('invalid', 'in-use');
        colors[group].selected = value;
        markSelected(group, value);
        updateTrigger(group);
        schedulePreview();
      }
    }

    function onCustomHex(group, raw) {
      const input = document.getElementById('custom-' + group);
      let val = raw.trim();
      if (val && !val.startsWith('#')) val = '#' + val;
      input.value = val;

      if (val === '') { input.classList.remove('invalid', 'in-use'); return; }
      if (!/^#[0-9A-Fa-f]{6}$/.test(val)) {
        input.classList.add('invalid'); input.classList.remove('in-use');
        return;
      }
      input.classList.remove('invalid'); input.classList.add('in-use');
      colors[group].selected = val.toUpperCase();
      markSelected(group, '_custom');
      updateTrigger(group);
      schedulePreview();
    }

    function refreshColorLabels() {
      for (const group of ['line', 'bg', 'fc']) {
        const cd = document.getElementById('cd-' + group);
        const lbl = cd.querySelector('.cd-option-custom-label');
        if (lbl) lbl.textContent = t('colorCustom');
      }
    }

    // ══════════════ Mode switching ══════════════
    function setMode(m) {
      mode = m;
      document.querySelectorAll('[data-mode]').forEach(b => {
        const active = b.dataset.mode === m;
        b.classList.toggle('active', active);
        b.classList.toggle('text-zinc-400', !active);
      });
      document.querySelectorAll('[data-mode-panel]').forEach(p => {
        p.classList.toggle('hidden', p.dataset.modePanel !== m);
      });
      updateStatus(); schedulePreview();
    }

    // ══════════════ Files (Mode A) ══════════════
    // selectedFiles items are { file: File, title: string|null }

    const dropzone = document.getElementById('dropzone');
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault(); dropzone.classList.remove('drag-over');
      const files = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().endsWith('.pdf'));
      if (files.length) { selectedFiles = [...selectedFiles, ...wrap(files)]; afterFilesChange(); }
    });
    function wrap(files) { return files.map(f => ({ file: f, title: null })); }
    function handleFiles(list) {
      const files = Array.from(list).filter(f => f.name.toLowerCase().endsWith('.pdf'));
      selectedFiles = [...selectedFiles, ...wrap(files)]; afterFilesChange();
    }
    function removeFile(i) { selectedFiles.splice(i, 1); afterFilesChange(); }
    function clearFiles() { selectedFiles = []; document.getElementById('fileinput').value = ''; afterFilesChange(); }
    function sortFiles(o) {
      selectedFiles.sort((a,b) => o==='az' ? a.file.name.localeCompare(b.file.name) : b.file.name.localeCompare(a.file.name));
      afterFilesChange();
    }
    function moveFile(from, to) {
      if (to < 0 || to >= selectedFiles.length) return;
      const [it] = selectedFiles.splice(from, 1);
      selectedFiles.splice(to, 0, it); afterFilesChange();
    }
    function afterFilesChange() { renderFileList(); updateStatus(); schedulePreview(); }

    // Mirror of server-side cleanTitle (toc_engine.go:279)
    function defaultTitle(filename) {
      const dot = filename.lastIndexOf('.');
      let name = dot > 0 ? filename.slice(0, dot) : filename;
      name = name.replace(/^\d+[\s\-_.]+/, '');     // strip leading numbers
      name = name.replace(/_/g, ' ');
      name = name.replace(/-/g, ' – ');
      return name.trim();
    }
    function displayTitle(item) { return item.title || defaultTitle(item.file.name); }

    let dragFrom = null;
    function renderFileList() {
      const ul = document.getElementById('files');
      const actions = document.getElementById('files-actions');
      if (!selectedFiles.length) { ul.innerHTML = ''; actions.classList.add('hidden'); return; }
      actions.classList.remove('hidden');
      ul.innerHTML = selectedFiles.map((item, i) => `
        <li class="file-item file-row flex items-center gap-1 px-1.5 py-1 rounded hover:bg-zinc-800 ${item.title ? 'has-custom' : ''}"
            draggable="true" data-i="${i}"
            ondragstart="onDragStart(event, ${i})" ondragover="onDragOver(event, ${i})"
            ondragleave="onDragLeave(event)" ondrop="onDrop(event, ${i})" ondragend="onDragEnd(event)">
          <span class="drag-handle text-zinc-600 text-base leading-none">⠿</span>
          <span class="file-title flex-1 truncate text-zinc-300 cursor-text"
                title="${esc(item.file.name)} — double-click or ✎ to rename"
                ondblclick="startEdit(${i})">${esc(displayTitle(item))}</span>
          <button onclick="startEdit(${i})" class="pencil" title="Rename" aria-label="Rename">
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"/>
            </svg>
          </button>
          <span class="text-[13px] text-zinc-500">${fmtSize(item.file.size)}</span>
          <button onclick="moveFile(${i},${i-1})" class="text-zinc-600 hover:text-zinc-300 px-0.5 ${i===0?'invisible':''}" title="Up">▲</button>
          <button onclick="moveFile(${i},${i+1})" class="text-zinc-600 hover:text-zinc-300 px-0.5 ${i===selectedFiles.length-1?'invisible':''}" title="Down">▼</button>
          <button onclick="removeFile(${i})" class="text-zinc-500 hover:text-red-400 px-1">×</button>
        </li>`).join('');
    }

    function startEdit(i) {
      const li = document.querySelector(`#files li[data-i="${i}"]`);
      if (!li || li.classList.contains('editing')) return;
      const span = li.querySelector('.file-title');
      const current = displayTitle(selectedFiles[i]);
      li.classList.add('editing');
      const input = document.createElement('input');
      input.type = 'text'; input.className = 'title-input flex-1 truncate';
      input.value = current; input.dataset.original = current;
      span.replaceWith(input);
      input.focus(); input.select();
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); finishEdit(i, input.value, true); }
        else if (e.key === 'Escape') { e.preventDefault(); finishEdit(i, null, false); }
      });
      input.addEventListener('blur', () => finishEdit(i, input.value, true));
    }
    function finishEdit(i, value, save) {
      const item = selectedFiles[i]; if (!item) return;
      if (save) {
        const v = (value || '').trim();
        const def = defaultTitle(item.file.name);
        item.title = (v === '' || v === def) ? null : v; // empty or matches default → clear custom
      }
      renderFileList(); schedulePreview();
    }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function fmtSize(b) { if (b<1024) return b+' B'; if (b<1024*1024) return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
    function onDragStart(e, i) { dragFrom = i; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', i); }
    function onDragOver(e, i) { e.preventDefault(); document.querySelectorAll('.file-item').forEach(el=>el.classList.remove('drag-over-item')); if (dragFrom!==null && dragFrom!==i) e.currentTarget.classList.add('drag-over-item'); }
    function onDragLeave(e) { e.currentTarget.classList.remove('drag-over-item'); }
    function onDrop(e, to) { e.preventDefault(); e.currentTarget.classList.remove('drag-over-item'); if (dragFrom!==null && dragFrom!==to) moveFile(dragFrom, to); dragFrom=null; }
    function onDragEnd(e) { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.file-item').forEach(el=>el.classList.remove('drag-over-item')); dragFrom=null; }

    function onModeBChange() {
      pdfFile  = document.getElementById('fileinput-pdf').files[0]  || null;
      jsonFile = document.getElementById('fileinput-json').files[0] || null;
      updateStatus(); schedulePreview();
    }

    function updateStatus() {
      const meta = document.getElementById('files-meta');
      const stats = document.getElementById('footer-stats');
      if (mode === 'a') {
        const total = selectedFiles.reduce((s,it)=>s+it.file.size, 0);
        const text = selectedFiles.length ? t('statusFiles')(selectedFiles.length, fmtSize(total)) : '';
        meta.textContent = text; stats.textContent = text || '—';
      } else {
        const parts = [];
        if (pdfFile) parts.push('PDF: ' + fmtSize(pdfFile.size));
        if (jsonFile) parts.push('JSON: ' + fmtSize(jsonFile.size));
        stats.textContent = parts.join(' · ') || '—';
      }
    }

    // ══════════════ Preview rendering ══════════════
    let debounceTimer = null;
    let currentController = null;
    let currentBlobUrl = null;
    let currentFilename = null;
    const DEBOUNCE_MS = 700;

    function inputsReady() {
      if (mode === 'a') return selectedFiles.length > 0;
      return pdfFile && jsonFile;
    }

    function schedulePreview() {
      if (debounceTimer) clearTimeout(debounceTimer);
      if (!inputsReady()) { showEmpty(); return; }
      setStatusDot('staling', t('previewStale'));
      debounceTimer = setTimeout(renderPreview, DEBOUNCE_MS);
    }

    async function renderPreview() {
      if (!inputsReady()) { showEmpty(); return; }

      // Cancel in-flight
      if (currentController) currentController.abort();
      currentController = new AbortController();

      hideError();
      document.getElementById('preview-empty').classList.add('hidden');
      document.getElementById('preview-loading').classList.remove('hidden');
      setStatusDot('rendering', t('previewRendering'));

      const formData = new FormData();
      const title = document.getElementById('title').value.trim();
      const subtitle = document.getElementById('subtitle').value.trim();
      if (title) formData.append('title', title);
      if (subtitle) formData.append('subtitle', subtitle);
      formData.append('font', document.getElementById('font').value);
      formData.append('lang', currentLang);
      formData.append('dot_leaders', document.getElementById('dots').checked);
      formData.append('show_lines', document.getElementById('lines').checked);
      if (document.getElementById('lines').checked) formData.append('line_color', colors.line.selected);
      formData.append('bg_color', colors.bg.selected);
      formData.append('font_color', colors.fc.selected);

      let endpoint;
      if (mode === 'a') {
        endpoint = '/api/generate/folder';
        formData.append('merge_only', document.getElementById('merge-only').checked);
        for (const it of selectedFiles) {
          formData.append('files', it.file);
          formData.append('titles', it.title || '');
        }
      } else {
        endpoint = '/api/generate/json';
        formData.append('pdf', pdfFile);
        formData.append('json_file', jsonFile);
      }

      try {
        const resp = await fetch(endpoint, { method: 'POST', body: formData, signal: currentController.signal });
        if (!resp.ok) {
          let msg = 'HTTP ' + resp.status;
          try { const j = await resp.json(); msg = j.error || j.detail || msg; } catch {}
          showRenderError(msg); return;
        }
        const blob = await resp.blob();
        const disp = resp.headers.get('content-disposition') || '';
        const m = disp.match(/filename="(.+?)"/);
        currentFilename = m ? m[1] : t('fallback');

        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = URL.createObjectURL(blob);
        document.getElementById('preview-frame').src = currentBlobUrl + '#toolbar=0&navpanes=0';
        document.getElementById('preview-info').textContent = fmtSize(blob.size);
        setStatusDot('ready', t('previewReady'));
      } catch (err) {
        if (err.name === 'AbortError') return;
        showRenderError(err.message);
      } finally {
        document.getElementById('preview-loading').classList.add('hidden');
      }
    }

    function showEmpty() {
      document.getElementById('preview-empty').classList.remove('hidden');
      document.getElementById('preview-loading').classList.add('hidden');
      hideError();
      document.getElementById('preview-frame').src = 'about:blank';
      document.getElementById('preview-info').textContent = '';
      setStatusDot('idle', t('previewIdle'));
    }
    function showRenderError(msg) {
      document.getElementById('preview-error').classList.remove('hidden');
      document.getElementById('preview-error-msg').textContent = msg;
      setStatusDot('error', t('errorTitle'));
    }
    function hideError() { document.getElementById('preview-error').classList.add('hidden'); }
    function setStatusDot(state, label) {
      const dot = document.getElementById('preview-dot');
      const lbl = document.getElementById('preview-label');
      const stat = document.getElementById('preview-status');
      const map = {
        idle:    ['bg-base-300', 'text-zinc-500'],
        staling: ['bg-amber-400', 'text-amber-400'],
        rendering: ['bg-amber-400 animate-pulse', 'text-amber-400'],
        ready:   ['bg-emerald-500', 'text-emerald-400'],
        error:   ['bg-red-500', 'text-red-400'],
      };
      const [dotCls, statCls] = map[state] || map.idle;
      dot.className = 'h-2 w-2 rounded-full ' + dotCls;
      lbl.textContent = label;
      stat.className = 'text-[13px] ' + statCls;
      stat.textContent = label;
      // Download is only valid when the current preview is fresh
      document.getElementById('btn-generate').disabled = state !== 'ready';
    }

    // ══════════════ Download ══════════════
    function downloadCurrent() {
      if (!currentBlobUrl) return;
      const a = document.createElement('a');
      a.href = currentBlobUrl; a.download = currentFilename || 'inhaltsverzeichnis.pdf';
      document.body.appendChild(a); a.click(); a.remove();
    }

    // ══════════════ Mobile sheet ══════════════
    function openPreviewSheet() {
      const c = document.getElementById('canvas');
      c.classList.remove('hidden'); c.classList.add('flex');
      requestAnimationFrame(() => c.classList.add('open'));
    }
    function closePreviewSheet() {
      const c = document.getElementById('canvas');
      c.classList.remove('open');
      setTimeout(() => { if (window.innerWidth < 768) { c.classList.add('hidden'); c.classList.remove('flex'); } }, 250);
    }

    // ══════════════ Keyboard ══════════════
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        if (!document.getElementById('btn-generate').disabled) downloadCurrent();
      }
      if (e.key === 'Escape' && window.innerWidth < 768
          && document.getElementById('canvas').classList.contains('open')) {
        closePreviewSheet();
      }
    });

    // Swipe-down to close on mobile
    (function () {
      const canvas = document.getElementById('canvas');
      let startY = null;
      canvas.addEventListener('touchstart', e => {
        if (window.innerWidth >= 768) return;
        if (e.touches[0].clientY < 80) startY = e.touches[0].clientY; // only from top area
      }, { passive: true });
      canvas.addEventListener('touchmove', e => {
        if (startY === null) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 80) { closePreviewSheet(); startY = null; }
      }, { passive: true });
      canvas.addEventListener('touchend', () => { startY = null; });
    })();

    // ══════════════ Resizable sidebar ══════════════
    (function () {
      const DEFAULT_W = 620, MIN_W = 380, KEY = 'toc-studio-sidebar-w';
      const root = document.documentElement;
      const divider = document.getElementById('divider');

      function setWidth(px) {
        const max = Math.round(window.innerWidth * 0.8);
        const w = Math.max(MIN_W, Math.min(max, Math.round(px)));
        root.style.setProperty('--sidebar-w', w + 'px');
        return w;
      }

      // Restore saved width
      const saved = parseInt(localStorage.getItem(KEY), 10);
      if (Number.isFinite(saved)) setWidth(saved);

      let dragging = false;
      divider.addEventListener('pointerdown', e => {
        if (window.innerWidth < 768) return;
        dragging = true;
        divider.setPointerCapture(e.pointerId);
        divider.classList.add('dragging');
        document.body.classList.add('col-resizing');
        e.preventDefault();
      });
      divider.addEventListener('pointermove', e => {
        if (!dragging) return;
        setWidth(e.clientX);
      });
      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        try { divider.releasePointerCapture(e.pointerId); } catch {}
        divider.classList.remove('dragging');
        document.body.classList.remove('col-resizing');
        const w = parseInt(getComputedStyle(root).getPropertyValue('--sidebar-w'), 10);
        if (Number.isFinite(w)) localStorage.setItem(KEY, w);
      }
      divider.addEventListener('pointerup', endDrag);
      divider.addEventListener('pointercancel', endDrag);

      // Double-click to reset
      divider.addEventListener('dblclick', () => {
        setWidth(DEFAULT_W);
        localStorage.removeItem(KEY);
      });
    })();

    // ══════════════ Init ══════════════
    ['title','subtitle','font'].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', schedulePreview);
      el.addEventListener('change', schedulePreview);
    });

    applyStoredTheme();
    applyTranslations();
    updateLangButtons();
    initColorDropdown('line');
    initColorDropdown('bg');
    initColorDropdown('fc');
    showEmpty();
  </script>
</body>
</html>
